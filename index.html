<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youmelittlepenny - Personal Wealth OS</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React, ReactDOM, Babel (để trình duyệt đọc trực tiếp React/TSX) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Nền đen OLED tối giản chuẩn Cyberpunk */
    body {
      background-color: #000000;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-black text-zinc-100 antialiased selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- I18N DICTIONARY (Strict EN & KO Only) ---
    const I18N = {
      EN: {
        title: "Youmelittlepenny",
        authPlaceholder: "Enter Passcode",
        authSubmit: "Unlock Vault",
        authError: "Invalid passcode. Access Denied.",
        dashboard: "Dashboard",
        korea: "Korea (KRW)",
        vietnam: "Vietnam (VND)",
        investments: "Investments & Gold",
        cashflow: "Cashflow & Budget",
        liabilities: "Liabilities / Deposits",
        history: "Audit Ledger",
        settings: "Settings & Sync",
        netWorth: "Global Net Worth",
        totalAssets: "Total Assets",
        totalLiabilities: "Total Liabilities",
        parking: "Parking Account",
        subpots: "Sub-Pots (Allocated)",
        addSubpot: "Allocate Sub-Pot",
        termSavings: "Term Deposits / Jeokgeum",
        openSavings: "Open Savings",
        partialWithdraw: "Partial Withdrawal (Max 2)",
        syncNow: "Sync to Google Drive",
        syncSuccess: "Synced successfully to Google Drive / Finance / Report!",
        syncFailed: "Sync failed. Check Webhook URL in Settings.",
        fmarketNav: "Fetch Latest NAV",
        logout: "Lock Vault"
      },
      KO: {
        title: "Youmelittlepenny",
        authPlaceholder: "비밀번호를 입력하세요",
        authSubmit: "보관함 열기",
        authError: "비밀번호가 올바르지 않습니다.",
        dashboard: "대시보드",
        korea: "한국 금융 (KRW)",
        vietnam: "베트남 금융 (VND)",
        investments: "투자 & 실물자산",
        cashflow: "현금흐름 & 지출",
        liabilities: "부채 & 보관 보증금",
        history: "감사 로그",
        settings: "설정 & 동기화",
        netWorth: "총 순자산",
        totalAssets: "총 자산",
        totalLiabilities: "총 부채",
        parking: "파킹통장",
        subpots: "나눠모으기",
        addSubpot: "나눠모으기 생성",
        termSavings: "정기예금 / 적금",
        openSavings: "신규 적금 등록",
        partialWithdraw: "중도인출 실행 (최대 2회)",
        syncNow: "구글 드라이브 동기화",
        syncSuccess: "구글 드라이브 / Finance / Report 에 동기화 완료!",
        syncFailed: "동기화 실패. 설정에서 URL을 확인하세요.",
        fmarketNav: "기준가(NAV) 갱신",
        logout: "잠금"
      }
    };

    function App() {
      // 1. Password Protection ($1Million)
      const [isAuthenticated, setIsAuthenticated] = useState(() => sessionStorage.getItem('vault_auth') === 'true');
      const [passcode, setPasscode] = useState('');
      const [authError, setAuthError] = useState(false);

      // 2. Language & Navigation
      const [lang, setLang] = useState('EN');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [baseCurrency, setBaseCurrency] = useState('USD');

      // 3. FX Rates & Settings
      const [fxRates, setFxRates] = useState(() => {
        const saved = localStorage.getItem('v_fx');
        return saved ? JSON.parse(saved) : { USD_KRW: 1380, USD_VND: 25400, KRW_VND: 18.4 };
      });
      const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('v_gas_url') || '');
      const [syncMsg, setSyncMsg] = useState(null);

      // 4. Financial Records
      const [krwParking, setKrwParking] = useState(() => {
        const saved = localStorage.getItem('v_krw_parking');
        return saved ? JSON.parse(saved) : [
          { id: 'kp1', bank: 'Toss Bank', balance: 9000000, rate: 2.0, subPots: [{ id: 'sp1', name: 'PhD Study Fund', amount: 765000 }] }
        ];
      });

      const [krwSavings, setKrwSavings] = useState(() => {
        const saved = localStorage.getItem('v_krw_savings');
        return saved ? JSON.parse(saved) : [];
      });

      const [vndParking, setVndParking] = useState(() => {
        const saved = localStorage.getItem('v_vnd_parking');
        return saved ? JSON.parse(saved) : [
          { id: 'vp1', bank: 'Techcombank', balance: 6000000, rate: 0.2 }
        ];
      });

      const [vndDeposits, setVndDeposits] = useState(() => {
        const saved = localStorage.getItem('v_vnd_deposits');
        return saved ? JSON.parse(saved) : [];
      });

      const [funds, setFunds] = useState(() => {
        const saved = localStorage.getItem('v_funds');
        return saved ? JSON.parse(saved) : [
          { id: 'f1', ticker: 'MBBOND', units: 65.5, buyNav: 15267, currentNav: 15450 },
          { id: 'f2', ticker: 'MBAM', units: 32.0, buyNav: 15600, currentNav: 15600 }
        ];
      });

      const [assets, setAssets] = useState(() => {
        const saved = localStorage.getItem('v_assets');
        return saved ? JSON.parse(saved) : [
          { id: 'a1', name: 'Apartment VN (95% paid)', type: 'REAL_ESTATE', valuation: 2000000000, currency: 'VND' }
        ];
      });

      const [liabilities, setLiabilities] = useState(() => {
        const saved = localStorage.getItem('v_liabilities');
        return saved ? JSON.parse(saved) : [
          { id: 'l1', name: 'Tenant Security Deposit Held', amount: 14000000, currency: 'VND' }
        ];
      });

      const [cashflows, setCashflows] = useState(() => {
        const saved = localStorage.getItem('v_cashflows');
        return saved ? JSON.parse(saved) : [
          { id: 'cf1', date: '2026-05-09', type: 'INCOME', cat: 'Salary', amount: 2414477, currency: 'KRW', desc: 'Design KR' },
          { id: 'cf2', date: '2026-05-09', type: 'INCOME', cat: 'Rental', amount: 7300000, currency: 'VND', desc: 'Apartment Rent' }
        ];
      });

      const [auditLogs, setAuditLogs] = useState(() => {
        const saved = localStorage.getItem('v_audit');
        return saved ? JSON.parse(saved) : [];
      });

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('v_fx', JSON.stringify(fxRates));
        localStorage.setItem('v_gas_url', gasUrl);
        localStorage.setItem('v_krw_parking', JSON.stringify(krwParking));
        localStorage.setItem('v_krw_savings', JSON.stringify(krwSavings));
        localStorage.setItem('v_vnd_parking', JSON.stringify(vndParking));
        localStorage.setItem('v_vnd_deposits', JSON.stringify(vndDeposits));
        localStorage.setItem('v_funds', JSON.stringify(funds));
        localStorage.setItem('v_assets', JSON.stringify(assets));
        localStorage.setItem('v_liabilities', JSON.stringify(liabilities));
        localStorage.setItem('v_cashflows', JSON.stringify(cashflows));
        localStorage.setItem('v_audit', JSON.stringify(auditLogs));
      }, [fxRates, gasUrl, krwParking, krwSavings, vndParking, vndDeposits, funds, assets, liabilities, cashflows, auditLogs]);

      const t = I18N[lang];

      // Currency converter
      const toUSD = (amt, curr) => {
        if (curr === 'USD') return amt;
        if (curr === 'KRW') return amt / (fxRates.USD_KRW || 1);
        if (curr === 'VND') return amt / (fxRates.USD_VND || 1);
        return amt;
      };

      const fromUSD = (amtUSD, toCurr) => {
        if (toCurr === 'USD') return amtUSD;
        if (toCurr === 'KRW') return amtUSD * (fxRates.USD_KRW || 1);
        if (toCurr === 'VND') return amtUSD * (fxRates.USD_VND || 1);
        return amtUSD;
      };

      const formatCurr = (amt, curr) => {
        if (curr === 'USD') return `$${amt.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        if (curr === 'KRW') return `₩${Math.round(amt).toLocaleString()}`;
        return `₫${Math.round(amt).toLocaleString()}`;
      };

      // Calculate Net Worth: Assets - Liabilities
      const totals = useMemo(() => {
        let assetsUSD = 0;
        krwParking.forEach(p => assetsUSD += toUSD(p.balance, 'KRW'));
        krwSavings.forEach(s => assetsUSD += toUSD(s.principal, 'KRW'));
        vndParking.forEach(p => assetsUSD += toUSD(p.balance, 'VND'));
        vndDeposits.forEach(d => assetsUSD += toUSD(d.principal, 'VND'));
        funds.forEach(f => assetsUSD += toUSD(f.units * f.currentNav, 'VND'));
        assets.forEach(a => assetsUSD += toUSD(a.valuation, a.currency));

        let liabUSD = 0;
        liabilities.forEach(l => liabUSD += toUSD(l.amount, l.currency));

        const netUSD = assetsUSD - liabUSD;
        return {
          assetsUSD,
          liabUSD,
          netUSD,
          netKRW: fromUSD(netUSD, 'KRW'),
          netVND: fromUSD(netUSD, 'VND')
        };
      }, [krwParking, krwSavings, vndParking, vndDeposits, funds, assets, liabilities, fxRates]);

      const logAudit = (action, details, amount = '') => {
        setAuditLogs(prev => [{ id: 'a_' + Date.now(), time: new Date().toLocaleString(), action, details, amount }, ...prev]);
      };

      // Unlock modal check
      const handleLogin = (e) => {
        e.preventDefault();
        if (passcode === '$1Million') {
          sessionStorage.setItem('vault_auth', 'true');
          setIsAuthenticated(true);
          setAuthError(false);
        } else {
          setAuthError(true);
        }
      };

      // Fmarket NAV Fetcher (via public proxy)
      const fetchFmarketNAV = async () => {
        try {
          const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://api.fmarket.vn/res/products/filter'));
          const data = await res.json();
          const parsed = JSON.parse(data.contents);
          if (parsed && parsed.data && parsed.data.rows) {
            setFunds(prev => prev.map(f => {
              const item = parsed.data.rows.find(r => r.code?.toUpperCase() === f.ticker.toUpperCase());
              return item?.nav ? { ...f, currentNav: item.nav } : f;
            }));
            alert('NAV updated from Fmarket successfully!');
            logAudit('NAV Update', 'Updated latest fund NAV from Fmarket');
          }
        } catch (err) {
          alert('Could not auto-fetch NAV. You can edit NAV manually in settings/inputs.');
        }
      };

      // Sync to Google Apps Script
      const syncToGAS = async () => {
        if (!gasUrl) {
          alert('Please enter your Webhook URL in Settings first.');
          setActiveTab('settings');
          return;
        }
        try {
          await fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              netWorth: totals,
              accounts: [...krwParking, ...vndParking, ...vndDeposits],
              cashflow: cashflows
            })
          });
          setSyncMsg(t.syncSuccess);
          logAudit('Cloud Sync', 'Triggered sync to Google Apps Script');
        } catch (err) {
          setSyncMsg(t.syncFailed);
        }
      };

      // UI: Password Modal
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="w-full max-w-sm bg-zinc-950 border border-zinc-800 rounded-xl p-6 shadow-2xl">
              <div className="text-center mb-6">
                <h1 className="text-xl font-bold tracking-tight text-white mb-1">{t.title}</h1>
                <p className="text-xs text-zinc-500 uppercase tracking-widest">Personal Net Worth OS</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="password"
                  value={passcode}
                  onChange={(e) => setPasscode(e.target.value)}
                  placeholder={t.authPlaceholder}
                  className="w-full bg-black border border-zinc-800 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"
                />
                {authError && <p className="text-xs text-rose-500">{t.authError}</p>}
                <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-500 text-black font-semibold py-2 rounded text-sm transition-all">
                  {t.authSubmit}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-black text-zinc-100 flex flex-col font-sans">
          {/* Header */}
          <header className="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur border-b border-zinc-900 px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <span className="font-bold text-sm tracking-wide text-white">{t.title}</span>
              <div className="text-xs bg-black border border-zinc-800 px-2.5 py-1 rounded">
                <span className="text-zinc-500 mr-1.5">{t.netWorth}:</span>
                <span className="font-mono font-bold text-cyan-400">
                  {baseCurrency === 'USD' && formatCurr(totals.netUSD, 'USD')}
                  {baseCurrency === 'KRW' && formatCurr(totals.netKRW, 'KRW')}
                  {baseCurrency === 'VND' && formatCurr(totals.netVND, 'VND')}
                </span>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {/* Currency Selector */}
              <div className="flex bg-black border border-zinc-800 rounded text-xs">
                {['USD', 'KRW', 'VND'].map(c => (
                  <button
                    key={c}
                    onClick={() => setBaseCurrency(c)}
                    className={`px-2 py-1 rounded transition-colors ${baseCurrency === c ? 'bg-zinc-800 text-white font-bold' : 'text-zinc-400'}`}
                  >
                    {c}
                  </button>
                ))}
              </div>

              {/* Language Switcher */}
              <button
                onClick={() => setLang(lang === 'EN' ? 'KO' : 'EN')}
                className="px-2 py-1 bg-black border border-zinc-800 rounded text-xs font-semibold text-zinc-300 hover:text-white"
              >
                {lang}
              </button>

              {/* Sync Button */}
              <button
                onClick={syncToGAS}
                className="px-2.5 py-1 bg-emerald-950/60 border border-emerald-800/80 text-emerald-400 text-xs rounded hover:bg-emerald-900/60 font-medium"
              >
                {t.syncNow}
              </button>

              {/* Logout Button */}
              <button
                onClick={() => { sessionStorage.removeItem('vault_auth'); setIsAuthenticated(false); }}
                className="px-2 py-1 bg-black border border-zinc-800 rounded text-xs text-zinc-500 hover:text-rose-400"
              >
                {t.logout}
              </button>
            </div>
          </header>

          {/* Sync status toast */}
          {syncMsg && (
            <div className="bg-emerald-950 border-b border-emerald-800 px-4 py-1.5 text-xs text-emerald-300 flex justify-between">
              <span>{syncMsg}</span>
              <button onClick={() => setSyncMsg(null)} className="underline ml-2">Close</button>
            </div>
          )}

          {/* Navigation Bar */}
          <nav className="bg-zinc-950 border-b border-zinc-900 px-4 flex gap-1 overflow-x-auto text-xs">
            {[
              { id: 'dashboard', label: t.dashboard },
              { id: 'korea', label: t.korea },
              { id: 'vietnam', label: t.vietnam },
              { id: 'investments', label: t.investments },
              { id: 'cashflow', label: t.cashflow },
              { id: 'liabilities', label: t.liabilities },
              { id: 'history', label: t.history },
              { id: 'settings', label: t.settings },
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`py-2.5 px-3 border-b-2 font-medium whitespace-nowrap transition-colors ${
                  activeTab === tab.id ? 'border-cyan-400 text-cyan-400' : 'border-transparent text-zinc-400 hover:text-zinc-200'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* Body Content */}
          <main className="flex-1 p-4 max-w-6xl w-full mx-auto space-y-6">
            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg">
                    <p className="text-xs text-zinc-500 uppercase">{t.netWorth} (USD)</p>
                    <h3 className="text-xl font-bold font-mono text-cyan-400 mt-1">{formatCurr(totals.netUSD, 'USD')}</h3>
                    <div className="text-[11px] text-zinc-500 mt-2">
                      Assets: {formatCurr(totals.assetsUSD, 'USD')} | Debt: {formatCurr(totals.liabUSD, 'USD')}
                    </div>
                  </div>
                  <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg">
                    <p className="text-xs text-zinc-500 uppercase">{t.netWorth} (KRW)</p>
                    <h3 className="text-xl font-bold font-mono text-indigo-400 mt-1">{formatCurr(totals.netKRW, 'KRW')}</h3>
                    <p className="text-[11px] text-zinc-500 mt-2 font-mono">1 USD = ₩{fxRates.USD_KRW.toLocaleString()}</p>
                  </div>
                  <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg">
                    <p className="text-xs text-zinc-500 uppercase">{t.netWorth} (VND)</p>
                    <h3 className="text-xl font-bold font-mono text-emerald-400 mt-1">{formatCurr(totals.netVND, 'VND')}</h3>
                    <p className="text-[11px] text-zinc-500 mt-2 font-mono">1 USD = ₫{fxRates.USD_VND.toLocaleString()}</p>
                  </div>
                </div>

                <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                  <h3 className="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Quick Asset Composition</h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                    <div className="p-3 bg-black border border-zinc-900 rounded">
                      <span className="text-zinc-500 block">KRW Cash / Parking</span>
                      <span className="font-mono text-sm text-cyan-400">₩{krwParking.reduce((a,b)=>a+b.balance,0).toLocaleString()}</span>
                    </div>
                    <div className="p-3 bg-black border border-zinc-900 rounded">
                      <span className="text-zinc-500 block">VND Cash / Deposits</span>
                      <span className="font-mono text-sm text-emerald-400">₫{vndParking.reduce((a,b)=>a+b.balance,0).toLocaleString()}</span>
                    </div>
                    <div className="p-3 bg-black border border-zinc-900 rounded">
                      <span className="text-zinc-500 block">Mutual Funds (VND)</span>
                      <span className="font-mono text-sm text-amber-400">₫{funds.reduce((a,b)=>a+b.units*b.currentNav,0).toLocaleString()}</span>
                    </div>
                    <div className="p-3 bg-black border border-zinc-900 rounded">
                      <span className="text-zinc-500 block">Tenant Deposits Held (Debt)</span>
                      <span className="font-mono text-sm text-rose-400">₫{liabilities.reduce((a,b)=>a+b.amount,0).toLocaleString()}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: KOREA */}
            {activeTab === 'korea' && (
              <div className="space-y-4">
                <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                  <h3 className="text-sm font-semibold text-white">{t.parking} (KRW)</h3>
                  {krwParking.map(acc => (
                    <div key={acc.id} className="bg-black border border-zinc-900 p-3 rounded space-y-2">
                      <div className="flex justify-between items-center">
                        <div>
                          <span className="font-medium text-white">{acc.bank}</span>
                          <span className="text-xs text-zinc-500 ml-2">Yield: {acc.rate}%</span>
                        </div>
                        <span className="font-mono font-bold text-cyan-400 text-sm">₩{acc.balance.toLocaleString()}</span>
                      </div>

                      {/* Sub-pots */}
                      <div className="border-t border-zinc-900 pt-2 space-y-1">
                        <span className="text-[11px] text-zinc-500 font-semibold">{t.subpots}:</span>
                        {acc.subPots.map(sp => (
                          <div key={sp.id} className="flex justify-between text-xs bg-zinc-900/50 px-2 py-1 rounded">
                            <span className="text-zinc-400">{sp.name}</span>
                            <span className="font-mono text-indigo-400">₩{sp.amount.toLocaleString()}</span>
                          </div>
                        ))}
                      </div>

                      {/* Add subpot form */}
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        const form = e.target;
                        const name = form.pName.value;
                        const amt = Number(form.pAmt.value);
                        if (amt > acc.balance) return alert('Insufficient parking balance.');
                        setKrwParking(prev => prev.map(p => p.id === acc.id ? {
                          ...p,
                          balance: p.balance - amt,
                          subPots: [...p.subPots, { id: 'sp_' + Date.now(), name, amount: amt }]
                        } : p));
                        logAudit('Subpot Created', `Allocated ₩${amt.toLocaleString()} to ${name}`);
                        form.reset();
                      }} className="flex gap-2 pt-1 text-xs">
                        <input name="pName" placeholder="Sub-pot Name (e.g. PhD)" required className="flex-1 bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-white" />
                        <input name="pAmt" type="number" placeholder="Amount (₩)" required className="w-28 bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-white" />
                        <button type="submit" className="bg-cyan-600 text-black font-semibold px-2.5 py-1 rounded">{t.addSubpot}</button>
                      </form>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: VIETNAM */}
            {activeTab === 'vietnam' && (
              <div className="space-y-4">
                <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                  <h3 className="text-sm font-semibold text-white">{t.vietnam} - Liquid Accounts</h3>
                  {vndParking.map(acc => (
                    <div key={acc.id} className="bg-black border border-zinc-900 p-3 rounded flex justify-between items-center text-xs">
                      <div>
                        <span className="font-medium text-white">{acc.bank}</span>
                        <span className="text-zinc-500 ml-2">Rate: {acc.rate}%</span>
                      </div>
                      <span className="font-mono font-bold text-emerald-400 text-sm">₫{acc.balance.toLocaleString()}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: INVESTMENTS & GOLD */}
            {activeTab === 'investments' && (
              <div className="space-y-4">
                <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-semibold text-white">Vietnam Mutual Funds (CCQ)</h3>
                    <button onClick={fetchFmarketNAV} className="text-xs bg-emerald-950 border border-emerald-800 text-emerald-400 px-2 py-1 rounded">
                      {t.fmarketNav}
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    {funds.map(f => (
                      <div key={f.id} className="bg-black border border-zinc-900 p-3 rounded space-y-1">
                        <div className="flex justify-between font-bold text-white">
                          <span>{f.ticker}</span>
                          <span className="text-emerald-400 font-mono">₫{Math.round(f.units * f.currentNav).toLocaleString()}</span>
                        </div>
                        <div className="text-zinc-500 flex justify-between">
                          <span>Units: {f.units}</span>
                          <span>NAV: ₫{f.currentNav.toLocaleString()}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                  <h3 className="text-sm font-semibold text-white">Real Estate & Physical Assets</h3>
                  {assets.map(a => (
                    <div key={a.id} className="bg-black border border-zinc-900 p-3 rounded flex justify-between items-center text-xs">
                      <div>
                        <span className="font-medium text-white">{a.name}</span>
                        <span className="text-zinc-500 ml-2">({a.type})</span>
                      </div>
                      <span className="font-mono font-bold text-amber-400">{formatCurr(a.valuation, a.currency)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: CASHFLOW */}
            {activeTab === 'cashflow' && (
              <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-white">{t.cashflow}</h3>
                <div className="overflow-x-auto text-xs">
                  <table className="w-full text-left">
                    <thead className="border-b border-zinc-800 text-zinc-500">
                      <tr>
                        <th className="py-2">Date</th>
                        <th className="py-2">Type</th>
                        <th className="py-2">Category</th>
                        <th className="py-2">Desc</th>
                        <th className="py-2 text-right">Amount</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-900 font-mono">
                      {cashflows.map(cf => (
                        <tr key={cf.id}>
                          <td className="py-2 text-zinc-400">{cf.date}</td>
                          <td className="py-2"><span className={cf.type === 'INCOME' ? 'text-emerald-400' : 'text-rose-400'}>{cf.type}</span></td>
                          <td className="py-2 text-zinc-300">{cf.cat}</td>
                          <td className="py-2 text-zinc-400">{cf.desc}</td>
                          <td className={`py-2 text-right ${cf.type === 'INCOME' ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {cf.type === 'INCOME' ? '+' : '-'}{formatCurr(cf.amount, cf.currency)}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: LIABILITIES */}
            {activeTab === 'liabilities' && (
              <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-white">{t.liabilities}</h3>
                <p className="text-xs text-zinc-500">Refundable tenant security deposits held are deducted from Net Worth calculation.</p>
                {liabilities.map(l => (
                  <div key={l.id} className="bg-black border border-zinc-900 p-3 rounded flex justify-between items-center text-xs">
                    <div>
                      <span className="font-medium text-white">{l.name}</span>
                      <span className="text-[10px] text-rose-400 border border-rose-900 px-1 rounded ml-2">HELD DEPOSIT</span>
                    </div>
                    <span className="font-mono font-bold text-rose-400">{formatCurr(l.amount, l.currency)}</span>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: AUDIT LEDGER */}
            {activeTab === 'history' && (
              <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-white">{t.history}</h3>
                <div className="space-y-2 text-xs">
                  {auditLogs.map(log => (
                    <div key={log.id} className="bg-black border border-zinc-900 p-2.5 rounded flex justify-between">
                      <div>
                        <span className="font-medium text-zinc-300">{log.action}</span>
                        <p className="text-[11px] text-zinc-500">{log.details}</p>
                      </div>
                      <span className="text-zinc-600 font-mono text-[11px]">{log.time}</span>
                    </div>
                  ))}
                  {auditLogs.length === 0 && <p className="text-zinc-600 text-xs">No ledger records yet.</p>}
                </div>
              </div>
            )}

            {/* TAB: SETTINGS & GAS SYNC */}
            {activeTab === 'settings' && (
              <div className="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-4 text-xs">
                <h3 className="text-sm font-semibold text-white">Google Apps Script Webhook</h3>
                <div>
                  <label className="text-zinc-400 block mb-1">Webhook URL:</label>
                  <input
                    type="text"
                    value={gasUrl}
                    onChange={(e) => setGasUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full bg-black border border-zinc-800 rounded p-2 text-white font-mono"
                  />
                </div>

                <div className="border-t border-zinc-900 pt-3">
                  <h4 className="text-xs font-semibold text-zinc-400 mb-2">Exchange Rates Override</h4>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <span className="text-zinc-500 block">USD/KRW</span>
                      <input type="number" value={fxRates.USD_KRW} onChange={e=>setFxRates({...fxRates, USD_KRW: Number(e.target.value)})} className="w-full bg-black border border-zinc-800 p-1.5 rounded font-mono text-white" />
                    </div>
                    <div>
                      <span className="text-zinc-500 block">USD/VND</span>
                      <input type="number" value={fxRates.USD_VND} onChange={e=>setFxRates({...fxRates, USD_VND: Number(e.target.value)})} className="w-full bg-black border border-zinc-800 p-1.5 rounded font-mono text-white" />
                    </div>
                    <div>
                      <span className="text-zinc-500 block">KRW/VND</span>
                      <input type="number" step="0.01" value={fxRates.KRW_VND} onChange={e=>setFxRates({...fxRates, KRW_VND: Number(e.target.value)})} className="w-full bg-black border border-zinc-800 p-1.5 rounded font-mono text-white" />
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
