<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youmelittlepenny</title>
  <!-- Tailwind CSS & Lucide Icons CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone để biên dịch JSX trên trình duyệt -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vaultBg: '#090d16',
            vaultPanel: '#111827',
            vaultBorder: '#1f293d'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Constants
    const MASTER_PASS = '$1Million';
    const DEFAULT_FX = { USD_KRW: 1350, USD_VND: 25400, KRW_VND: 18.81 };

    function App() {
      // 1. Authentication
      const [authed, setAuthed] = useState(() => sessionStorage.getItem('yp_auth') === 'true');
      const [pwd, setPwd] = useState('');
      const [loginErr, setLoginErr] = useState(false);

      // 2. Settings & Global State
      const [lang, setLang] = useState('EN');
      const [baseCurr, setBaseCurr] = useState('USD');
      const [tab, setTab] = useState('dashboard');
      const [fx, setFx] = useState(DEFAULT_FX);
      const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('yp_gas_url') || '');
      const [syncing, setSyncing] = useState(false);
      const [syncMsg, setSyncMsg] = useState(null);

      // 3. Financial Data State
      const [krwAccounts, setKrwAccounts] = useState(() => {
        const saved = localStorage.getItem('yp_krw');
        return saved ? JSON.parse(saved) : [
          {
            id: 'kr-1',
            bank: 'Toss Bank',
            name: 'Daily Parking Vault',
            type: 'PARKING',
            principal: 9000000,
            rate: 2.1,
            tax: 15.4,
            subPots: [{ id: 'sp-1', name: 'Tuition Reserve', amount: 765000 }],
            earlyWithdrawals: []
          }
        ];
      });

      const [vndAccounts, setVndAccounts] = useState(() => {
        const saved = localStorage.getItem('yp_vnd');
        return saved ? JSON.parse(saved) : [
          { id: 'vn-1', bank: 'Techcombank', name: 'Liquid Checking', type: 'PARKING', principal: 6000000, rate: 0.5 },
          { id: 'vn-2', bank: 'MB Bank', name: 'May 9 Rebalance Deposit', type: 'TERM', principal: 7000000, rate: 5.5, term: '12M', targetDate: '2027-05-09' }
        ];
      });

      const [funds, setFunds] = useState(() => {
        const saved = localStorage.getItem('yp_funds');
        return saved ? JSON.parse(saved) : [
          { id: 'f-1', ticker: 'MBBOND', units: 65.5, buyNav: 15267, currentNav: 15450 }
        ];
      });

      const [assets, setAssets] = useState(() => {
        const saved = localStorage.getItem('yp_assets');
        return saved ? JSON.parse(saved) : [
          { id: 'a-1', name: 'Apartment Unit 12B', type: 'REAL_ESTATE', val: 2150000000, curr: 'VND' }
        ];
      });

      const [liabilities, setLiabilities] = useState(() => {
        const saved = localStorage.getItem('yp_liab');
        return saved ? JSON.parse(saved) : [
          { id: 'l-1', name: 'Tenant Rental Deposit Held', amount: 14000000, curr: 'VND', note: 'Must return upon contract end' }
        ];
      });

      const [cashflow, setCashflow] = useState(() => {
        const saved = localStorage.getItem('yp_cf');
        return saved ? JSON.parse(saved) : [
          { id: 'c-1', date: '2026-05-01', type: 'INCOME', category: 'Salary', amount: 2400000, curr: 'KRW' },
          { id: 'c-2', date: '2026-05-01', type: 'INCOME', category: 'Rental', amount: 7300000, curr: 'VND' }
        ];
      });

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('yp_krw', JSON.stringify(krwAccounts));
        localStorage.setItem('yp_vnd', JSON.stringify(vndAccounts));
        localStorage.setItem('yp_funds', JSON.stringify(funds));
        localStorage.setItem('yp_assets', JSON.stringify(assets));
        localStorage.setItem('yp_liab', JSON.stringify(liabilities));
        localStorage.setItem('yp_cf', JSON.stringify(cashflow));
        localStorage.setItem('yp_gas_url', gasUrl);
      }, [krwAccounts, vndAccounts, funds, assets, liabilities, cashflow, gasUrl]);

      // Currency Converter
      const toUSD = (amt, curr) => {
        if (curr === 'USD') return amt;
        if (curr === 'KRW') return amt / fx.USD_KRW;
        if (curr === 'VND') return amt / fx.USD_VND;
        return amt;
      };

      const fromUSD = (amtUsd, targetCurr) => {
        if (targetCurr === 'USD') return amtUsd;
        if (targetCurr === 'KRW') return amtUsd * fx.USD_KRW;
        if (targetCurr === 'VND') return amtUsd * fx.USD_VND;
        return amtUsd;
      };

      const formatCurr = (val, curr) => {
        return new Intl.NumberFormat(lang === 'KO' ? 'ko-KR' : 'en-US', {
          style: 'currency',
          currency: curr,
          maximumFractionDigits: curr === 'USD' ? 2 : 0
        }).format(val);
      };

      // Metrics calculation
      const metrics = useMemo(() => {
        const krwTotal = krwAccounts.reduce((acc, a) => {
          const subTotal = (a.subPots || []).reduce((s, p) => s + p.amount, 0);
          return acc + a.principal + subTotal;
        }, 0);

        const vndTotal = vndAccounts.reduce((acc, a) => acc + a.principal, 0);
        const fundsVnd = funds.reduce((acc, f) => acc + (f.units * f.currentNav), 0);
        const assetsUsd = assets.reduce((acc, a) => acc + toUSD(a.val, a.curr), 0);

        const grossAssetsUsd = toUSD(krwTotal, 'KRW') + toUSD(vndTotal + fundsVnd, 'VND') + assetsUsd;
        const liabilitiesUsd = liabilities.reduce((acc, l) => acc + toUSD(l.amount, l.curr), 0);
        const netWorthUsd = grossAssetsUsd - liabilitiesUsd;

        return {
          grossAssetsUsd,
          liabilitiesUsd,
          netWorthUsd,
          netWorthKRW: fromUSD(netWorthUsd, 'KRW'),
          netWorthVND: fromUSD(netWorthUsd, 'VND')
        };
      }, [krwAccounts, vndAccounts, funds, assets, liabilities, fx]);

      // Handlers
      const doLogin = (e) => {
        e.preventDefault();
        if (pwd === MASTER_PASS) {
          setAuthed(true);
          sessionStorage.setItem('yp_auth', 'true');
          setLoginErr(false);
        } else {
          setLoginErr(true);
        }
      };

      const syncToGAS = async () => {
        if (!gasUrl) {
          alert(lang === 'KO' ? '설정 탭에서 Google Apps Script URL을 먼저 입력하세요.' : 'Please enter Google Apps Script URL in Settings.');
          setTab('settings');
          return;
        }
        setSyncing(true);
        try {
          const payload = {
            timestamp: new Date().toISOString(),
            netWorth: metrics,
            krwAccounts,
            vndAccounts,
            funds,
            assets,
            liabilities,
            cashflow
          };
          await fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncMsg(lang === 'KO' ? 'Google Drive / Finance / Report 동기화 요청 전송 완료!' : 'Dispatched sync payload to Google Drive / Finance / Report!');
        } catch (err) {
          alert('Sync error: ' + err.message);
        } finally {
          setSyncing(false);
        }
      };

      // Lock Screen
      if (!authed) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[#090d16]">
            <div className="w-full max-w-md bg-[#111827] border border-[#1f293d] rounded-2xl p-8 shadow-2xl">
              <div className="w-12 h-12 mx-auto mb-4 bg-indigo-500/10 border border-indigo-500/30 rounded-xl flex items-center justify-center text-indigo-400 font-bold text-xl">
                YP
              </div>
              <h1 className="text-2xl font-bold text-center text-white">Youmelittlepenny</h1>
              <p className="text-xs text-slate-400 text-center mb-6 mt-1 font-mono">PRIVATE WEALTH VAULT</p>
              <form onSubmit={doLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Passcode</label>
                  <input
                    type="password"
                    value={pwd}
                    onChange={(e) => setPwd(e.target.value)}
                    placeholder="Enter Master Password"
                    className="w-full bg-[#090d16] border border-[#1f293d] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                </div>
                {loginErr && <p className="text-xs text-rose-400 font-mono">Access Denied. Invalid Passcode.</p>}
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl transition">
                  Unlock Vault
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Header */}
          <header className="sticky top-0 z-50 bg-[#111827]/90 backdrop-blur border-b border-[#1f293d] px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 rounded-lg bg-indigo-600 text-white font-bold flex items-center justify-center text-sm">YP</span>
                <div>
                  <h1 className="font-bold text-sm text-white leading-tight">Youmelittlepenny</h1>
                  <span className="text-[10px] text-emerald-400 font-mono">SECURE LIVE VAULT</span>
                </div>
              </div>

              <div className="flex items-center gap-3 text-xs">
                {/* FX Ticker */}
                <div className="hidden md:flex gap-2 bg-[#090d16] border border-[#1f293d] rounded-lg px-3 py-1 font-mono text-slate-400">
                  <span>USD/KRW: {fx.USD_KRW}</span>
                  <span>|</span>
                  <span>USD/VND: {fx.USD_VND}</span>
                </div>

                {/* Base Currency Toggle */}
                <div className="flex bg-[#090d16] border border-[#1f293d] rounded-lg p-0.5">
                  {['USD', 'KRW', 'VND'].map(c => (
                    <button
                      key={c}
                      onClick={() => setBaseCurr(c)}
                      className={`px-2 py-0.5 rounded font-semibold ${baseCurr === c ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                    >
                      {c}
                    </button>
                  ))}
                </div>

                {/* Language Toggle */}
                <button
                  onClick={() => setLang(lang === 'EN' ? 'KO' : 'EN')}
                  className="px-2 py-1 rounded bg-[#090d16] border border-[#1f293d] font-semibold text-slate-300"
                >
                  {lang}
                </button>

                {/* Sync Button */}
                <button
                  onClick={syncToGAS}
                  disabled={syncing}
                  className="px-3 py-1 rounded bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 font-semibold flex items-center gap-1 hover:bg-emerald-600/30 transition"
                >
                  {syncing ? 'Syncing...' : (lang === 'KO' ? '구글 동기화' : 'Sync to Sheets')}
                </button>

                <button
                  onClick={() => { sessionStorage.removeItem('yp_auth'); setAuthed(false); }}
                  className="p-1 text-slate-400 hover:text-rose-400"
                  title="Lock Vault"
                >
                  ✕
                </button>
              </div>
            </div>

            {/* Sub-tabs Navigation */}
            <div className="max-w-7xl mx-auto flex gap-2 overflow-x-auto mt-3 pt-2 border-t border-[#1f293d] text-xs font-semibold">
              {[
                { id: 'dashboard', label: lang === 'KO' ? '대시보드' : 'Dashboard' },
                { id: 'krw', label: lang === 'KO' ? '한국 금융 (KRW)' : 'Korea Finance (KRW)' },
                { id: 'vnd', label: lang === 'KO' ? '베트남 금융 (VND)' : 'Vietnam Finance (VND)' },
                { id: 'invest', label: lang === 'KO' ? '펀드 & 자산' : 'Funds & Real Estate' },
                { id: 'cashflow', label: lang === 'KO' ? '현금흐름' : 'Cashflow' },
                { id: 'liabilities', label: lang === 'KO' ? '부채 & 보증금' : 'Liabilities & Deposits' },
                { id: 'settings', label: lang === 'KO' ? '설정' : 'Settings' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-3 py-1.5 rounded-lg whitespace-nowrap transition ${tab === t.id ? 'bg-[#1f293d] text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:text-white'}`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          {syncMsg && (
            <div className="bg-emerald-950/60 border-b border-emerald-800 text-emerald-400 text-xs px-4 py-2 flex justify-between">
              <span>✓ {syncMsg}</span>
              <button onClick={() => setSyncMsg(null)} className="underline">Dismiss</button>
            </div>
          )}

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 space-y-6">
            {/* 1. DASHBOARD TAB */}
            {tab === 'dashboard' && (
              <div className="space-y-6">
                <div className="bg-[#111827] border border-[#1f293d] rounded-2xl p-6">
                  <span className="text-xs uppercase font-mono text-indigo-400 tracking-wider">
                    {lang === 'KO' ? '실시간 통합 순자산' : 'Consolidated Net Worth'}
                  </span>
                  <div className="text-3xl lg:text-4xl font-extrabold text-white mt-1">
                    {formatCurr(fromUSD(metrics.netWorthUsd, baseCurr), baseCurr)}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4 pt-4 border-t border-[#1f293d] text-xs">
                    <div>
                      <span className="text-slate-400">USD Value:</span>
                      <p className="font-mono font-bold text-white text-sm">{formatCurr(metrics.netWorthUsd, 'USD')}</p>
                    </div>
                    <div>
                      <span className="text-slate-400">KRW Value:</span>
                      <p className="font-mono font-bold text-sky-400 text-sm">{formatCurr(metrics.netWorthKRW, 'KRW')}</p>
                    </div>
                    <div>
                      <span className="text-slate-400">VND Value:</span>
                      <p className="font-mono font-bold text-emerald-400 text-sm">{formatCurr(metrics.netWorthVND, 'VND')}</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-[#111827] border border-[#1f293d] rounded-xl p-4">
                    <span className="text-xs text-slate-400">{lang === 'KO' ? '총 자산' : 'Total Gross Assets'}</span>
                    <p className="text-xl font-bold text-emerald-400 font-mono mt-1">
                      {formatCurr(fromUSD(metrics.grossAssetsUsd, baseCurr), baseCurr)}
                    </p>
                  </div>
                  <div className="bg-[#111827] border border-[#1f293d] rounded-xl p-4">
                    <span className="text-xs text-slate-400">{lang === 'KO' ? '총 부채 & 반환 보증금' : 'Liabilities & Held Deposits'}</span>
                    <p className="text-xl font-bold text-rose-400 font-mono mt-1">
                      {formatCurr(fromUSD(metrics.liabilitiesUsd, baseCurr), baseCurr)}
                    </p>
                  </div>
                </div>
              </div>
            )}

            {/* 2. KOREA TAB */}
            {tab === 'krw' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-lg font-bold text-white">{lang === 'KO' ? '한국 금융 관리 (KRW)' : 'Korea Finance (KRW)'}</h2>
                  <button
                    onClick={() => {
                      const name = prompt('Account Name:');
                      const bal = parseFloat(prompt('Initial Balance (KRW):') || '0');
                      if (name && bal > 0) {
                        setKrwAccounts([...krwAccounts, {
                          id: 'kr-' + Date.now(),
                          bank: 'KakaoBank',
                          name,
                          type: 'PARKING',
                          principal: bal,
                          rate: 2.0,
                          tax: 15.4,
                          subPots: [],
                          earlyWithdrawals: []
                        }]);
                      }
                    }}
                    className="px-3 py-1.5 bg-indigo-600 rounded-lg text-xs font-semibold text-white"
                  >
                    + Add Account
                  </button>
                </div>

                {krwAccounts.map(acc => {
                  const preTax = acc.principal * (1 + (acc.rate / 100));
                  const postTax = acc.principal + ((preTax - acc.principal) * (1 - acc.tax / 100));

                  return (
                    <div key={acc.id} className="bg-[#111827] border border-[#1f293d] rounded-xl p-5 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] bg-sky-500/20 text-sky-400 px-2 py-0.5 rounded font-mono font-bold">{acc.bank}</span>
                          <h3 className="font-bold text-white mt-1">{acc.name}</h3>
                        </div>
                        <div className="text-right">
                          <span className="text-xs text-slate-400 block">Principal</span>
                          <span className="font-bold font-mono text-sky-400 text-base">{formatCurr(acc.principal, 'KRW')}</span>
                        </div>
                      </div>

                      {/* Tax & Rate row */}
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-[#090d16] p-3 rounded-lg text-xs font-mono">
                        <div>
                          <span className="text-slate-500 block">Rate: {acc.rate}%</span>
                        </div>
                        <div>
                          <span className="text-slate-500 block">Tax: {acc.tax}%</span>
                        </div>
                        <div>
                          <span className="text-slate-500 block">Pre-tax:</span>
                          <span className="text-slate-200">{formatCurr(preTax, 'KRW')}</span>
                        </div>
                        <div>
                          <span className="text-slate-500 block">Net Payout:</span>
                          <span className="text-emerald-400">{formatCurr(postTax, 'KRW')}</span>
                        </div>
                      </div>

                      {/* Sub-Pots (나눠모으기) */}
                      <div className="space-y-2 pt-2 border-t border-[#1f293d]">
                        <div className="flex justify-between items-center text-xs">
                          <span className="font-semibold text-slate-300">{lang === 'KO' ? '나눠모으기 (Sub-Pots)' : 'Sub-Pockets'}</span>
                          <button
                            onClick={() => {
                              const potName = prompt('Pocket Name:');
                              const potAmt = parseFloat(prompt('Transfer amount from Parking (KRW):') || '0');
                              if (potName && potAmt > 0 && potAmt <= acc.principal) {
                                setKrwAccounts(krwAccounts.map(a => a.id === acc.id ? {
                                  ...a,
                                  principal: a.principal - potAmt,
                                  subPots: [...(a.subPots || []), { id: 'sp-' + Date.now(), name: potName, amount: potAmt }]
                                } : a));
                              }
                            }}
                            className="text-indigo-400 hover:underline"
                          >
                            + Add Pocket
                          </button>
                        </div>
                        {(acc.subPots || []).map(p => (
                          <div key={p.id} className="flex justify-between items-center bg-[#090d16] px-3 py-1.5 rounded text-xs font-mono">
                            <span>{p.name}</span>
                            <span className="text-slate-300">{formatCurr(p.amount, 'KRW')}</span>
                          </div>
                        ))}
                      </div>

                      {/* Early Withdrawal (중도인출 2회) */}
                      <div className="pt-2 border-t border-[#1f293d] text-xs">
                        <div className="flex justify-between items-center">
                          <span className="text-slate-400">
                            {lang === 'KO' ? `중도인출 (${(acc.earlyWithdrawals || []).length}/2)` : `Early Withdrawals (${(acc.earlyWithdrawals || []).length}/2)`}
                          </span>
                          {(acc.earlyWithdrawals || []).length < 2 && (
                            <button
                              onClick={() => {
                                const wAmt = parseFloat(prompt('Principal to withdraw early (KRW):') || '0');
                                const wInt = parseFloat(prompt('Settled early interest (KRW):') || '0');
                                if (wAmt > 0 && wAmt <= acc.principal) {
                                  setKrwAccounts(krwAccounts.map(a => a.id === acc.id ? {
                                    ...a,
                                    principal: a.principal - wAmt,
                                    earlyWithdrawals: [...(a.earlyWithdrawals || []), { date: new Date().toISOString().split('T')[0], principal: wAmt, interest: wInt }]
                                  } : a));
                                }
                              }}
                              className="text-amber-400 hover:underline font-semibold"
                            >
                              Execute Early Withdrawal
                            </button>
                          )}
                        </div>
                        {(acc.earlyWithdrawals || []).map((ew, idx) => (
                          <div key={idx} className="bg-[#090d16] p-2 rounded mt-1 font-mono text-[11px] flex justify-between">
                            <span>#{idx+1} {ew.date}: Withdrew {formatCurr(ew.principal, 'KRW')}</span>
                            <span className="text-emerald-400">Interest: {formatCurr(ew.interest, 'KRW')}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* 3. VIETNAM TAB */}
            {tab === 'vnd' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-lg font-bold text-white">{lang === 'KO' ? '베트남 금융 관리 (VND)' : 'Vietnam Finance (VND)'}</h2>
                  <button
                    onClick={() => {
                      const name = prompt('Account Name:');
                      const bal = parseFloat(prompt('Deposit Amount (VND):') || '0');
                      if (name && bal > 0) {
                        setVndAccounts([...vndAccounts, {
                          id: 'vn-' + Date.now(),
                          bank: 'MB Bank',
                          name,
                          type: 'TERM',
                          principal: bal,
                          rate: 5.5,
                          term: '12M',
                          targetDate: '2027-05-09'
                        }]);
                      }
                    }}
                    className="px-3 py-1.5 bg-emerald-600 rounded-lg text-xs font-semibold text-white"
                  >
                    + Add VN Account
                  </button>
                </div>

                {vndAccounts.map(acc => (
                  <div key={acc.id} className="bg-[#111827] border border-[#1f293d] rounded-xl p-4 flex justify-between items-center">
                    <div>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-mono font-bold">{acc.bank}</span>
                      <h4 className="font-bold text-white text-sm mt-1">{acc.name}</h4>
                      <p className="text-xs text-slate-400 font-mono">Rate: {acc.rate}% {acc.targetDate && `• Target: ${acc.targetDate}`}</p>
                    </div>
                    <div className="text-right font-mono">
                      <span className="font-bold text-emerald-400 text-base">{formatCurr(acc.principal, 'VND')}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* 4. INVESTMENTS & REAL ESTATE */}
            {tab === 'invest' && (
              <div className="space-y-6">
                <div className="bg-[#111827] border border-[#1f293d] rounded-xl p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-white text-sm">Vietnam Mutual Funds (CCQ)</h3>
                    <button
                      onClick={() => {
                        const ticker = prompt('Fund Ticker (e.g. MBBOND, MBVF):');
                        const units = parseFloat(prompt('Units held:') || '0');
                        const nav = parseFloat(prompt('Current NAV:') || '0');
                        if (ticker && units > 0) {
                          setFunds([...funds, { id: 'f-' + Date.now(), ticker, units, buyNav: nav, currentNav: nav }]);
                        }
                      }}
                      className="px-2.5 py-1 bg-indigo-600 rounded text-xs text-white"
                    >
                      + Add Fund
                    </button>
                  </div>
                  <table className="w-full text-xs font-mono">
                    <thead className="text-slate-500 border-b border-[#1f293d] text-left">
                      <tr>
                        <th className="py-2">Ticker</th>
                        <th>Units</th>
                        <th>NAV</th>
                        <th>Valuation</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#1f293d]">
                      {funds.map(f => (
                        <tr key={f.id}>
                          <td className="py-2 font-bold text-white">{f.ticker}</td>
                          <td>{f.units}</td>
                          <td>{formatCurr(f.currentNav, 'VND')}</td>
                          <td className="font-bold text-emerald-400">{formatCurr(f.units * f.currentNav, 'VND')}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="bg-[#111827] border border-[#1f293d] rounded-xl p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-white text-sm">Real Estate & Physical Assets</h3>
                    <button
                      onClick={() => {
                        const name = prompt('Asset Name:');
                        const val = parseFloat(prompt('Valuation (VND):') || '0');
                        if (name && val > 0) {
                          setAssets([...assets, { id: 'a-' + Date.now(), name, type: 'REAL_ESTATE', val, curr: 'VND' }]);
                        }
                      }}
                      className="px-2.5 py-1 bg-amber-600 rounded text-xs text-white"
                    >
                      + Register Asset
                    </button>
                  </div>
                  {assets.map(a => (
                    <div key={a.id} className="flex justify-between items-center bg-[#090d16] p-3 rounded-lg text-xs font-mono">
                      <div>
                        <span className="text-slate-400 text-[10px] uppercase block">{a.type}</span>
                        <span className="font-bold text-white text-sm">{a.name}</span>
                      </div>
                      <span className="text-amber-400 font-bold">{formatCurr(a.val, a.curr)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 5. LIABILITIES & DEPOSITS HELD */}
            {tab === 'liabilities' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-bold text-white">Liabilities & Held Security Deposits</h2>
                    <p className="text-xs text-slate-400">Deducted from gross assets to prevent artificial Net Worth inflation.</p>
                  </div>
                </div>

                {liabilities.map(l => (
                  <div key={l.id} className="bg-[#111827] border border-[#1f293d] rounded-xl p-4 flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-white text-sm">{l.name}</h4>
                      <p className="text-xs text-slate-400">{l.note}</p>
                    </div>
                    <span className="text-rose-400 font-bold font-mono text-base">{formatCurr(l.amount, l.curr)}</span>
                  </div>
                ))}
              </div>
            )}

            {/* 6. CASHFLOW */}
            {tab === 'cashflow' && (
              <div className="space-y-4">
                <h2 className="text-lg font-bold text-white">Multi-Period Cashflow Tracker</h2>
                <div className="bg-[#111827] border border-[#1f293d] rounded-xl p-4 space-y-2 font-mono text-xs">
                  {cashflow.map(c => (
                    <div key={c.id} className="flex justify-between items-center border-b border-[#1f293d] pb-2">
                      <div>
                        <span className="text-slate-500 mr-2">{c.date}</span>
                        <span className="text-white font-semibold">{c.category}</span>
                      </div>
                      <span className={c.type === 'INCOME' ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                        {c.type === 'INCOME' ? '+' : '-'}{formatCurr(c.amount, c.curr)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 7. SETTINGS */}
            {tab === 'settings' && (
              <div className="bg-[#111827] border border-[#1f293d] rounded-xl p-6 space-y-4 text-xs">
                <h3 className="text-base font-bold text-white">Google Apps Script Webhook Configuration</h3>
                <p className="text-slate-400">
                  Enter your Web App URL. Snapshots will be automatically saved to: <br/>
                  <code className="text-indigo-400 font-mono">Google Drive / Finance / Report / Finance_Report_{'{Year}'}</code>
                </p>
                <div>
                  <label className="block text-slate-400 mb-1">Apps Script Exec URL:</label>
                  <input
                    type="text"
                    value={gasUrl}
                    onChange={(e) => setGasUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full bg-[#090d16] border border-[#1f293d] rounded px-3 py-2 text-white font-mono"
                  />
                </div>
                <button
                  onClick={() => {
                    const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ krwAccounts, vndAccounts, funds, assets, liabilities, cashflow }));
                    const a = document.createElement('a');
                    a.href = dataStr;
                    a.download = `Youmelittlepenny_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                  }}
                  className="px-4 py-2 bg-slate-800 text-white rounded font-semibold"
                >
                  Export JSON Backup
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
