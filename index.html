<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youmelittlepenny</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #050508; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .neon-cyan { color: #00f2fe; text-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }
    .neon-pink { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.4); }
    .neon-lime { color: #39ff14; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }
    .neon-amber { color: #ffb703; text-shadow: 0 0 10px rgba(255, 183, 3, 0.4); }
    .border-neon { border-color: rgba(0, 242, 254, 0.2); }
    .border-neon-pink { border-color: rgba(255, 0, 127, 0.2); }
    input, select, textarea { background-color: #0e0e17; border: 1px solid #1e1e2f; color: #f8fafc; }
    input:focus, select:focus, textarea:focus { border-color: #00f2fe; outline: none; box-shadow: 0 0 8px rgba(0,242,254,0.3); }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050508; }
    ::-webkit-scrollbar-thumb { background: #1e1e2f; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f2fe; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
