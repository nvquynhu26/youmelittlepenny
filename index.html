    // --- INITIAL DATA STATE ---
    const INITIAL_STATE = {

      fx: {

      },
      chartViewMode: "total", // "total" | "breakdown"
      timeHorizon: "1Y",
      cashflow: [

        { id: "cf2", name: "Korea Edu Support", type: "active", cur: "KRW", income: 0, savings: 200000 },
        { id: "cf3", name: "VN Property Rental", type: "passive", cur: "VND", income: 7300000, savings: 3500000 }
      ],
      koreaAccounts: [
        {

            { id: "h4", date: "2026-01-09", type: "Top-up", amount: 150000, balance: 865000 }
          ]
        }
      ],
      vietnamAccounts: [
        {

        {

          rate: 6.2,

          history: [

          ]
        }
      ],
      funds: [
        {
          id: "f_mbbond",
          ticker: "MBBOND",
          units: 45.2,
          nav: 22120,
          costBasis: 1000000,
          sparkline: [21800, 21850, 21920, 22010, 22050, 22080, 22120],
          history: [
            { id: "fh1", date: "2026-01-10", type: "Buy", units: 22.5, price: 21800, total: 490500 },
            { id: "fh2", date: "2026-02-10", type: "Buy", units: 22.7, price: 22120, total: 509500 }
          ]
        },
        {
          id: "f_mbam",
          ticker: "MBAM",
          units: 48.5,
          nav: 10310,
          costBasis: 500000,
          sparkline: [10250, 10260, 10280, 10290, 10300, 10305, 10310],
          history: [
            { id: "fh3", date: "2026-01-15", type: "Buy", units: 48.5, price: 10310, total: 500000 }
          ]
        }
      ],
      assetsLiabilities: [
        {
          id: "al_apt",
          name: "Vietnam Residential Apartment",
          type: "Real Estate",
          cur: "VND",
          grossVal: 2000000000,
          debt: 100000000,
          acqDate: "2023-04-15"
        },
        {
          id: "al_deposit",
          name: "Korea Housing Lease Deposit",
          type: "Lease Deposit",
          cur: "KRW",
          grossVal: 8000000,
          debt: 0,
          acqDate: "2024-05-01"
        },
        {
          id: "al_tenant_debt",
          name: "Tenant Deposit Liability",
          type: "Liability",
          cur: "VND",
          grossVal: 0,
          debt: 14000000,
          acqDate: "2025-05-09"
        }
      ]
    };

    function App() {
      const [state, setState] = useState(INITIAL_STATE);
      const [syncStatus, setSyncStatus] = useState("synced"); // synced | syncing | error
      const [expandedRows, setExpandedRows] = useState({});
      const [timeStr, setTimeStr] = useState("");
      const [activeTab, setActiveTab] = useState("dashboard"); // dashboard, banking, funds, assets, cashflow

      // Modals State
      const [editItem, setEditItem] = useState(null); // { type, data }
      const [topUpModal, setTopUpModal] = useState(null); // { accountType: 'kr'|'vn', id, name }
      const [fundTxModal, setFundTxModal] = useState(null); // { fundId, action: 'Buy'|'Sell' }

      const t = DICT[state.lang];

      // Clock ticker
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setTimeStr(now.toUTCString().replace("GMT", "UTC") + " | " + now.toLocaleTimeString());
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);
      }, []);

      // FX Converter Helper
      const toBase = (amount, cur) => {
        if (!amount) return 0;
        if (cur === state.baseCur) return amount;
        
        // Convert to USD first
        let inUSD = 0;
        if (cur === "USD") inUSD = amount;
        else if (cur === "KRW") inUSD = amount / state.fx.USDKRW;
        else if (cur === "VND") inUSD = amount / state.fx.USDVND;

        // Convert USD to baseCur
        if (state.baseCur === "USD") return inUSD;
        if (state.baseCur === "KRW") return inUSD * state.fx.USDKRW;
        if (state.baseCur === "VND") return inUSD * state.fx.USDVND;
        return amount;
      };

      const formatCur = (amount, currency = state.baseCur) => {
        const val = typeof amount === "number" ? amount : 0;
        return new Intl.NumberFormat(state.lang === "KO" ? "ko-KR" : "en-US", {
          maximumFractionDigits: currency === "USD" ? 2 : 0,
          minimumFractionDigits: currency === "USD" ? 2 : 0
        }).format(val) + " " + currency;
      };

      // --- AGGREGATIONS ---
      const aggregates = useMemo(() => {
        // Korea Banking Total
        const krTotal = state.koreaAccounts.reduce((sum, acc) => sum + toBase(acc.balance, "KRW"), 0);

        // Vietnam Banking Total
        const vnTotal = state.vietnamAccounts.reduce((sum, acc) => sum + toBase(acc.balance, "VND"), 0);

        // Funds Total
        const fundsTotal = state.funds.reduce((sum, f) => {
          const mVal = f.units * f.nav;
          return sum + toBase(mVal, "VND");
        }, 0);

        // Real Estate & Assets Equity Total
        const assetsTotal = state.assetsLiabilities.reduce((sum, a) => {
          const equity = a.grossVal - a.debt;
          return sum + toBase(equity, a.cur);
        }, 0);

        const netWorth = krTotal + vnTotal + fundsTotal + assetsTotal;

        // Cashflow savings rate calculation
        const totalCashIncomeBase = state.cashflow.reduce((sum, c) => sum + toBase(c.income, c.cur), 0);
        const totalAllocatedSavingsBase = state.cashflow.reduce((sum, c) => sum + toBase(c.savings, c.cur), 0);
        const savingsRate = totalCashIncomeBase > 0 ? (totalAllocatedSavingsBase / totalCashIncomeBase) * 100 : 0;

        return {
          krTotal,
          vnTotal,
          fundsTotal,
          assetsTotal,
          netWorth,
          totalCashIncomeBase,
          totalAllocatedSavingsBase,
          savingsRate
        };
      }, [state]);

      // Toggle Row Expansion
      const toggleRow = (id) => {
        setExpandedRows(prev => ({ ...prev, [id]: !prev[id] }));
      };

      // Top-up Handler
      const handleTopUpSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(e.target.amount.value);
        if (isNaN(amt) || amt <= 0) return;

        const date = e.target.date.value || new Date().toISOString().split("T")[0];
        const isKr = topUpModal.accountType === "kr";

        setState(prev => {
          const key = isKr ? "koreaAccounts" : "vietnamAccounts";
          const updated = prev[key].map(acc => {
            if (acc.id === topUpModal.id) {
              const newBal = acc.balance + amt;
              return {
                ...acc,
                balance: newBal,
                history: [
                  ...acc.history,
                  { id: "tx_" + Date.now(), date, type: "Top-up", amount: amt, balance: newBal }
                ]
              };
            }
            return acc;
          });
          return { ...prev, [key]: updated };
        });

        setTopUpModal(null);
      };

      // Update NAV Handler
      const handleUpdateNAV = (fundId) => {
        setState(prev => {
          const updated = prev.funds.map(f => {
            if (f.id === fundId) {
              // Simulated minor realistic closing move +/- 0.3%
              const shift = 1 + (Math.random() * 0.006 - 0.003);
              const newNav = Math.round(f.nav * shift);
              const newSparkline = [...f.sparkline.slice(1), newNav];
              return { ...f, nav: newNav, sparkline: newSparkline };
            }
            return f;
          });
          return { ...prev, funds: updated };
        });
      };

      // Fund Buy/Sell Handler
      const handleFundTxSubmit = (e) => {
        e.preventDefault();
        const units = parseFloat(e.target.units.value);
        const price = parseFloat(e.target.price.value);
        if (isNaN(units) || units <= 0 || isNaN(price) || price <= 0) return;

        const date = e.target.date.value || new Date().toISOString().split("T")[0];
        const action = fundTxModal.action;

        setState(prev => {
          const updated = prev.funds.map(f => {
            if (f.id === fundTxModal.fundId) {
              let newUnits = f.units;
              let newCost = f.costBasis;

              if (action === "Buy") {
                newUnits += units;
                newCost += units * price;
              } else {
                newUnits = Math.max(0, newUnits - units);
                newCost = f.units > 0 ? (newCost / f.units) * newUnits : 0;
              }

              return {
                ...f,
                units: parseFloat(newUnits.toFixed(2)),
                costBasis: Math.round(newCost),
                history: [
                  ...f.history,
                  { id: "ftx_" + Date.now(), date, type: action, units, price, total: Math.round(units * price) }
                ]
              };
            }
            return f;
          });
          return { ...prev, funds: updated };
        });

        setFundTxModal(null);
      };

      // Delete Cashflow
      const deleteCashflow = (id) => {
        if (!confirm(t.confirmDelete)) return;
        setState(prev => ({
          ...prev,
          cashflow: prev.cashflow.filter(c => c.id !== id)
        }));
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* --- TOP STATUS & APP BAR --- */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs">
            {/* Left: Brand & Status */}
            <div className="flex items-center gap-3">
              <span className="font-bold text-sm tracking-wider text-cyan-400 font-mono flex items-center gap-1.5">
                <span className="h-2 w-2 rounded-full bg-cyan-400 inline-block animate-pulse"></span>
                {t.brand}
              </span>
              <span className="text-slate-600">|</span>
              <span className="font-mono text-slate-400 hidden sm:inline">{timeStr}</span>
              <span className={`px-2 py-0.5 rounded text-[11px] font-mono border ${
                syncStatus === "synced" 
                  ? "bg-emerald-950/60 text-emerald-400 border-emerald-800/80" 
                  : "bg-amber-950/60 text-amber-400 border-amber-800/80"
              }`}>
                {syncStatus === "synced" ? t.statusSynced : t.statusSyncing}
              </span>
            </div>

            {/* Right: Global FX Rates & Toggles */}
            <div className="flex items-center gap-4">
              <div className="hidden lg:flex items-center gap-3 font-mono text-[11px] text-slate-400 bg-slate-950/80 px-2.5 py-1 rounded border border-slate-800">
                <span>USD/KRW: <strong className="text-slate-200">{state.fx.USDKRW}</strong></span>
                <span className="text-slate-700">|</span>
                <span>KRW/VND: <strong className="text-slate-200">{state.fx.KRWVND}</strong></span>
                <span className="text-slate-700">|</span>
                <span>USD/VND: <strong className="text-slate-200">{state.fx.USDVND}</strong></span>
              </div>

              {/* Base Currency Toggle */}
              <div className="flex rounded border border-slate-700 overflow-hidden font-mono">
                {["KRW", "VND", "USD"].map(c => (
                  <button
                    key={c}
                    onClick={() => setState(p => ({ ...p, baseCur: c }))}
                    className={`px-2 py-0.5 transition-colors ${state.baseCur === c ? "bg-cyan-600 text-white font-bold" : "bg-slate-900 text-slate-400 hover:bg-slate-800"}`}
                  >
                    {c}
                  </button>
                ))}
              </div>

              {/* Language Toggle */}
              <div className="flex rounded border border-slate-700 overflow-hidden font-mono font-medium">
                {["EN", "KO"].map(l => (
                  <button
                    key={l}
                    onClick={() => setState(p => ({ ...p, lang: l }))}
                    className={`px-2 py-0.5 transition-colors ${state.lang === l ? "bg-slate-200 text-slate-900 font-bold" : "bg-slate-900 text-slate-400 hover:bg-slate-800"}`}
                  >
                    {l}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* --- SUB-NAV / TABS --- */}
          <nav className="border-b border-slate-800 bg-slate-900/50 px-4 flex gap-1 overflow-x-auto text-xs font-mono">
            {[
              { id: "dashboard", label: t.chartViewTotal },
              { id: "banking", label: `${t.koreaBanking} & ${t.vietnamBanking}` },
              { id: "funds", label: t.funds },
              { id: "assets", label: t.assetsLiab },
              { id: "cashflow", label: t.cashflow }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2.5 border-b-2 font-medium transition-colors whitespace-nowrap ${
                  activeTab === tab.id
                    ? "border-cyan-400 text-cyan-400 bg-cyan-950/20"
                    : "border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/40"
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* --- MAIN TERMINAL CONTENT --- */}
          <main className="flex-1 p-4 max-w-7xl mx-auto w-full space-y-6">
            
            {/* --- TOP METRICS STRIP --- */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {/* Total Net Worth Card */}
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-lg shadow-sm">
                <div className="text-xs uppercase tracking-wider text-slate-400 font-mono mb-1">{t.totalNetWorth}</div>
                <div className="text-2xl sm:text-3xl font-bold font-mono text-cyan-400">
                  {formatCur(aggregates.netWorth)}
                </div>
                <div className="mt-2 text-xs text-slate-500 font-mono flex items-center gap-2">
                  <span>KRW: {formatCur(toBase(aggregates.netWorth, state.baseCur), "KRW")}</span>
                  <span>•</span>
                  <span>VND: {formatCur(toBase(aggregates.netWorth, state.baseCur), "VND")}</span>
                </div>
              </div>

              {/* Active Savings Rate Card */}
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-lg shadow-sm">
                <div className="text-xs uppercase tracking-wider text-slate-400 font-mono mb-1">{t.savingsRate}</div>
                <div className="text-2xl sm:text-3xl font-bold font-mono text-emerald-400">
                  {aggregates.savingsRate.toFixed(1)}%
                </div>
                <div className="mt-2 text-xs text-slate-500 font-mono flex items-center justify-between">
                  <span>{t.monthlyAllocatedSavings}: <strong className="text-slate-300">{formatCur(aggregates.totalAllocatedSavingsBase)}</strong></span>
                  <span>{t.monthlyCashIncome}: <strong className="text-slate-300">{formatCur(aggregates.totalCashIncomeBase)}</strong></span>
                </div>
              </div>
            </div>

            {/* --- PORTFOLIO DUAL-MODE VISUALIZATION MODULE --- */}
            {activeTab === "dashboard" && (
              <div className="bg-slate-900 border border-slate-800 p-4 rounded-lg shadow-sm space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-mono uppercase tracking-wider text-slate-300 font-bold">Portfolio View:</span>
                    
                    {/* BUTTON 1: TOTAL NET WORTH ONLY */}
                    <button
                      onClick={() => setState(p => ({ ...p, chartViewMode: "total" }))}
                      className={`px-3 py-1 text-xs font-mono rounded transition-colors ${
                        state.chartViewMode === "total"
                          ? "bg-cyan-500 text-slate-950 font-bold"
                          : "bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200"
                      }`}
                    >

                          <td className="py-2.5 px-3 text-right">
                            <button
                              onClick={() => deleteCashflow(c.id)}
                              className="px-2 py-0.5 text-rose-400 hover:text-rose-200 bg-rose-950/40 rounded border border-rose-900/60"
                            >
                              {t.delete}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* --- TOP-UP MODAL --- */}
          {topUpModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-lg max-w-sm w-full p-5 space-y-4 font-mono text-xs shadow-xl">
                <div className="font-bold text-slate-200 text-sm border-b border-slate-800 pb-2">
                  {t.topUp}: {topUpModal.name}
                </div>
                <form onSubmit={handleTopUpSubmit} className="space-y-3">
                  <div>
                    <label className="text-slate-400 block mb-1">{t.amount} ({topUpModal.accountType === "kr" ? "KRW" : "VND"})</label>
                    <input
                      name="amount"
                      type="number"
                      required
                      placeholder="e.g. 500000"
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-100 focus:border-cyan-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">{t.date}</label>
                    <input
                      name="date"
                      type="date"
                      defaultValue={new Date().toISOString().split("T")[0]}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-100 focus:border-cyan-500 focus:outline-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setTopUpModal(null)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded hover:bg-slate-700"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-cyan-600 text-white rounded hover:bg-cyan-500 font-bold"
                    >
                      {t.save}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- FUND TRANSACTION MODAL --- */}
          {fundTxModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-lg max-w-sm w-full p-5 space-y-4 font-mono text-xs shadow-xl">
                <div className="font-bold text-slate-200 text-sm border-b border-slate-800 pb-2">
                  {fundTxModal.action === "Buy" ? t.buy : t.sell}
                </div>
                <form onSubmit={handleFundTxSubmit} className="space-y-3">
                  <div>
                    <label className="text-slate-400 block mb-1">{t.units}</label>
                    <input
                      name="units"
                      type="number"
                      step="any"
                      required
                      placeholder="e.g. 25"
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-100 focus:border-purple-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">{t.nav} (VND)</label>
                    <input
                      name="price"
                      type="number"
                      step="any"
                      required
                      placeholder="e.g. 22100"
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-100 focus:border-purple-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">{t.date}</label>
                    <input
                      name="date"
                      type="date"
                      defaultValue={new Date().toISOString().split("T")[0]}
                      className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-slate-100 focus:border-purple-500 focus:outline-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setFundTxModal(null)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded hover:bg-slate-700"
                    >
                      {t.cancel}
                    </button>
                    <button
                      type="submit"
                      className="px-3 py-1.5 bg-purple-600 text-white rounded hover:bg-purple-500 font-bold"
                    >
                      {t.save}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
