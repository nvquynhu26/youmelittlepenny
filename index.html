  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],

            neonCyan: '#00f0ff',
            neonPink: '#ff007f',
            neonYellow: '#ffe600'
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #05070a; color: #f1f5f9; font-family: 'Inter', sans-serif; }
    .neon-text-green { text-shadow: 0 0 10px rgba(0, 255, 102, 0.4); }
    .neon-text-cyan { text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); }
    input, select, textarea {
      background-color: #07090e !important;
      border-color: #1e293b !important;
      color: #f8fafc !important;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00f0ff !important;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.25);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // ⚙️ GAS DEPLOYMENT WEBAPP URL
    // ==========================================
    const GOOGLE_APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzP7xhlbrMqSy_7ZrVNDNSh9drGYFGc3WVQZEF1ZVcF21DjLThvLYjyEBAjHvOh2AOm4Q/exec";

    const DEFAULT_JARS = [
      {
        id: "NEC",
        pct: 55,
        nameEn: "NEC (Necessities)",
        nameKo: "생활비 / 필수지출",

          { id: "nec_rent", en: "Rent / Housing", ko: "주거비 / 월세" },
          { id: "nec_util", en: "Utilities", ko: "공과금 (수도·광열·관리비)" },
          { id: "nec_groc", en: "Groceries", ko: "식비 / 장보기" },
          { id: "nec_dine", en: "Daily Dining", ko: "외식비" },
          { id: "nec_tran", en: "Transportation", ko: "교통비" },
          { id: "nec_tele", en: "Phone / Telecom", ko: "통신비" },
          { id: "nec_insu", en: "Insurance", ko: "보험료" },
          { id: "nec_heal", en: "Healthcare", ko: "의료비" }
        ]
      },
      {

          { id: "lts_rain", en: "Rainy-day Savings", ko: "예비비" }
        ]
      },
      {
        id: "EDU",
        pct: 10,
        nameEn: "EDU (Education)",
        nameKo: "자기계발 / 교육비",
        categories: [
          { id: "edu_tui", en: "Courses / Tuition", ko: "강의료 / 학비" },
          { id: "edu_book", en: "Books / Resources", ko: "도서구입비" },
          { id: "edu_lang", en: "Language Learning", ko: "어학학습비" },
          { id: "edu_tool", en: "Seminars / Tools", ko: "세미나 / 학습툴" }
        ]
      },
      {
        id: "FFA",
        pct: 10,
        nameEn: "FFA (Financial Freedom)",
        nameKo: "재테크 / 투자",
        categories: [
          { id: "ffa_stk", en: "Stocks / ETFs", ko: "주식 / ETF" },
          { id: "ffa_pen", en: "Retirement / Pension", ko: "연금 / IRP" },
          { id: "ffa_gro", en: "Growth Investments", ko: "투자원금" }
        ]
      },
      {
        id: "PLAY",
        pct: 10,
        nameEn: "PLAY (Play)",
        nameKo: "문화·여가 / 플렉스",
        categories: [
          { id: "ply_cafe", en: "Cafés & Socializing", ko: "카페 / 사교" },
          { id: "ply_ent", en: "Hobbies & Entertainment", ko: "취미 / 문화생활" },
          { id: "ply_trav", en: "Travel / Vacations", ko: "여행 / 휴가" },
          { id: "ply_shop", en: "Personal Shopping", ko: "쇼핑 / 기분전환" }
        ]
      },
      {
        id: "GIVE",
        pct: 5,
        nameEn: "GIVE (Give)",
        nameKo: "기부 / 경조사",
        categories: [
          { id: "giv_dona", en: "Donations / Charity", ko: "기부금 / 후원" },
          { id: "giv_fam", en: "Family & Gifts", ko: "가족용돈 / 선물" },
          { id: "giv_soc", en: "Social Obligations", ko: "경조사비" }
        ]
      }
    ];

    const KOREA_BANKS = ["Toss Bank", "KakaoBank", "Kookmin KB", "Shinhan", "Hana", "Woori", "K-Bank"];
    const VN_BANKS = ["MBBank", "Techcombank", "Vietcombank", "VPBank", "ACB", "TPBank"];
    const VN_FIXED_TERMS = ["1W", "2W", "3W", "1M", "2M", "3M", "4M", "6M", "9M", "12M", "18M", "24M", "36M"];
    const VN_FLEX_TERMS = ["6M", "7M", "8M", "9M", "10M", "11M", "12M", "18M", "24M", "36M"];

    function App() {
      const [authed, setAuthed] = useState(() => sessionStorage.getItem("auth_pass") === "$1Million");
      const [passInput, setPassInput] = useState("");
      const [lang, setLang] = useState("en");
      const [activeTab, setActiveTab] = useState("dash");
      const [syncStatus, setSyncStatus] = useState("idle");

      // Row edit lock
      const [editingId, setEditingId] = useState(null);
      const [editForm, setEditForm] = useState({});

      // Live exchange rates
      const [fx, setFx] = useState({ USD_KRW: 1385, USD_VND: 25420, KRW_VND: 18.35 });

      useEffect(() => {
        async function fetchRates() {
          try {
            const res = await fetch("https://open.er-api.com/v6/latest/USD");
            const data = await res.json();
            if (data && data.rates) {
              const u_krw = data.rates.KRW || 1385;
              const u_vnd = data.rates.VND || 25420;
              setFx({
                USD_KRW: Math.round(u_krw * 100) / 100,
                USD_VND: Math.round(u_vnd),
                KRW_VND: Math.round((u_vnd / u_krw) * 100) / 100
              });
            }
          } catch (e) {
            console.warn("Using offline FX fallback", e);
          }
        }
        fetchRates();
      }, []);

      // 6 Jars state
      const [jars, setJars] = useState(() => {
        const saved = localStorage.getItem("pen_jars");
        return saved ? JSON.parse(saved) : DEFAULT_JARS;
      });
      const [showJarModal, setShowJarModal] = useState(false);

      // KOREA STATE
      const [krParking, setKrParking] = useState(() => {
        const s = localStorage.getItem("pen_kr_parking");
        return s ? JSON.parse(s) : [
          { id: "kp1", bank: "Toss Bank", name: "Main Parking", balance: 500000, rate: 2.0, subPots: [{ id: "sp1", name: "Savings Spillover", balance: 75000 }] }
        ];
      });

      const [krSavings, setKrSavings] = useState(() => {
        const s = localStorage.getItem("pen_kr_savings");
        return s ? JSON.parse(s) : [
          {
            id: "ks1",
            bank: "Hana",
            name: "Fixed Deposit",
            type: "yegeum",
            principal: 9000000,
            currentPrincipal: 9000000,
            rate: 3.0,
            taxRate: 15.4,
            startDate: "2026-05-09",
            maturityDate: "2027-05-09",
            deposits: [],
            earlyWithdrawals: []
          },
          {
            id: "ks2",
            bank: "Toss Bank",
            name: "Study Fund",
            type: "jeokgeum",
            principal: 865000,
            currentPrincipal: 865000,
            rate: 1.4,
            taxRate: 15.4,
            startDate: "2026-01-01",
            maturityDate: "2027-05-09",
            deposits: [
              { id: "kd1", date: "2026-10-01", amount: 150000, source: "Toss Parking", mode: "Auto" },
              { id: "kd2", date: "2026-11-01", amount: 150000, source: "Toss Parking", mode: "Auto" }
            ],
            earlyWithdrawals: []
          }
        ];
      });

      // VIETNAM STATE
      const [vnParking, setVnParking] = useState(() => {
        const s = localStorage.getItem("pen_vn_parking");
        return s ? JSON.parse(s) : [
          { id: "vp1", bank: "MBBank", name: "Spending Account", balance: 3000000, rate: 0.2 }
        ];
      });

      const [vnSavings, setVnSavings] = useState(() => {
        const s = localStorage.getItem("pen_vn_savings");
        return s ? JSON.parse(s) : [
          {
            id: "vs1",
            bank: "MBBank",
            name: "Fixed Term Annual",
            type: "fixed",
            term: "12M",
            principal: 7000000,
            currentPrincipal: 7000000,
            rate: 4.3,
            startDate: "2026-05-09",
            maturityDate: "2027-05-09",
            deposits: []
          },
          {
            id: "vs2",
            bank: "MBBank",
            name: "Flexible Goal Deposit",
            type: "flexible",
            term: "12M",
            principal: 14000000,
            currentPrincipal: 14000000,
            rate: 6.2,
            startDate: "2026-05-09",
            maturityDate: "2027-05-09",
            deposits: [
              { id: "vd1", date: "2026-10-09", amount: 3500000, source: "MB Spending", mode: "Auto" },
              { id: "vd2", date: "2026-11-09", amount: 3500000, source: "MB Spending", mode: "Manual" }
            ]
          }
        ];
      });

      // MUTUAL FUNDS (TIERED BY TICKER WITH PURCHASE HISTORY)
      const [funds, setFunds] = useState(() => {
        const s = localStorage.getItem("pen_funds_tiered");
        return s ? JSON.parse(s) : [
          {
            ticker: "MBBOND",
            currentNav: 22450,
            purchases: [
              { id: "p_b1", date: "2026-09-01", units: 22.72, buyPrice: 22000, source: "MB Spending" },
              { id: "p_b2", date: "2026-10-01", units: 22.50, buyPrice: 22200, source: "MB Spending" }
            ]
          },
          {
            ticker: "MBVF",
            currentNav: 15300,
            purchases: [
              { id: "p_v1", date: "2026-10-15", units: 33.33, buyPrice: 15000, source: "MB Spending" }
            ]
          }
        ];
      });

      // REAL ESTATE / PROPERTIES
      const [properties, setProperties] = useState(() => {
        const s = localStorage.getItem("pen_properties");
        return s ? JSON.parse(s) : [
          { id: "pr1", name: "Apartment (95% Paid)", type: "Real Estate", address: "Ho Chi Minh City", buyDate: "2024-01-10", valuation: 2000000000, currency: "VND", fundedFrom: "None" },
          { id: "pr2", name: "Housing Key Deposit", type: "Deposit", address: "Seoul, Korea", buyDate: "2024-05-01", valuation: 8000000, currency: "KRW", fundedFrom: "None" }
        ];
      });

      // DEBTS & LIABILITIES
      const [debts, setDebts] = useState(() => {
        const s = localStorage.getItem("pen_debts");
        return s ? JSON.parse(s) : [
          { id: "d1", name: "Tenant Deposit (Refundable)", amount: 14000000, currency: "VND", party: "Tenant Room 102", dueDate: "2027-05-09" }
        ];
      });

      // CASHFLOW & TIMELINE
      const [cashflow, setCashflow] = useState(() => {
        const s = localStorage.getItem("pen_cashflow");
        return s ? JSON.parse(s) : [
          { id: "c1", date: "2026-11-01", type: "Income", jarId: "FFA", catId: "ffa_gro", amount: 2414477, currency: "KRW", account: "Toss Bank", desc: "Design Studio Seoul" },
          { id: "c2", date: "2026-11-01", type: "Income", jarId: "FFA", catId: "ffa_gro", amount: 7300000, currency: "VND", account: "MBBank", desc: "Apartment Rental" },
          { id: "c3", date: "2026-11-05", type: "Expense", jarId: "EDU", catId: "edu_lang", amount: 3300000, currency: "VND", account: "MBBank", desc: "Spanish Class" },
          { id: "c4", date: "2026-11-05", type: "Expense", jarId: "NEC", catId: "nec_rent", amount: 1164000, currency: "KRW", account: "Toss Bank", desc: "Seoul Rent & Living" }
        ];
      });

      // Filters for Cashflow tab
      const [cfFilterType, setCfFilterType] = useState("ALL");
      const [cfTimeframe, setCfTimeframe] = useState("MONTH");

      // Save states
      useEffect(() => { localStorage.setItem("pen_jars", JSON.stringify(jars)); }, [jars]);
      useEffect(() => { localStorage.setItem("pen_kr_parking", JSON.stringify(krParking)); }, [krParking]);
      useEffect(() => { localStorage.setItem("pen_kr_savings", JSON.stringify(krSavings)); }, [krSavings]);
      useEffect(() => { localStorage.setItem("pen_vn_parking", JSON.stringify(vnParking)); }, [vnParking]);
      useEffect(() => { localStorage.setItem("pen_vn_savings", JSON.stringify(vnSavings)); }, [vnSavings]);
      useEffect(() => { localStorage.setItem("pen_funds_tiered", JSON.stringify(funds)); }, [funds]);
      useEffect(() => { localStorage.setItem("pen_properties", JSON.stringify(properties)); }, [properties]);
      useEffect(() => { localStorage.setItem("pen_debts", JSON.stringify(debts)); }, [debts]);
      useEffect(() => { localStorage.setItem("pen_cashflow", JSON.stringify(cashflow)); }, [cashflow]);

      // Conversions
      const toVND = (v, c) => c === "VND" ? v : c === "KRW" ? v * fx.KRW_VND : v * fx.USD_VND;
      const toKRW = (v, c) => c === "KRW" ? v : c === "VND" ? v / fx.KRW_VND : v * fx.USD_KRW;
      const toUSD = (v, c) => c === "USD" ? v : c === "VND" ? v / fx.USD_VND : v / fx.USD_KRW;

      const fmt = (v, c) => {
        if (!v || isNaN(v)) return "0";
        if (c === "VND") return Math.round(v).toLocaleString() + " ₫";
        if (c === "KRW") return Math.round(v).toLocaleString() + " ₩";
        if (c === "USD") return "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return Number(v).toLocaleString();
      };

      // Aggregates
      const totals = useMemo(() => {
        const krCash = krParking.reduce((sum, p) => sum + p.balance + (p.subPots || []).reduce((spSum, sp) => spSum + sp.balance, 0), 0);
        const krDep = krSavings.reduce((sum, s) => sum + s.currentPrincipal, 0);
        const totalKoreaVND = toVND(krCash + krDep, "KRW");

        const vnCash = vnParking.reduce((sum, p) => sum + p.balance, 0);
        const vnDep = vnSavings.reduce((sum, s) => sum + s.currentPrincipal, 0);
        const totalVietnamVND = vnCash + vnDep;

        let totalFundCost = 0;
        let totalFundMarket = 0;
        funds.forEach(f => {
          (f.purchases || []).forEach(p => {
            totalFundCost += p.units * p.buyPrice;
            totalFundMarket += p.units * f.currentNav;
          });
        });

        const totalPropVND = properties.reduce((sum, p) => sum + toVND(p.valuation, p.currency), 0);
        const totalDebtVND = debts.reduce((sum, d) => sum + toVND(d.amount, d.currency), 0);

        const assetsVND = totalKoreaVND + totalVietnamVND + totalFundMarket + totalPropVND;
        const netVND = assetsVND - totalDebtVND;

        return {
          assetsVND,
          debtVND: totalDebtVND,
          netVND,
          netKRW: toKRW(netVND, "VND"),
          netUSD: toUSD(netVND, "VND"),
          totalKoreaVND,
          totalVietnamVND,
          totalFundMarket,
          totalFundCost,
          totalPropVND,
          categories4: [
            { name: "Real Estate", val: totalPropVND, color: "#ffe600" },
            { name: "Korea", val: totalKoreaVND, color: "#00f0ff" },
            { name: "Vietnam", val: totalVietnamVND, color: "#00ff66" },
            { name: "Funds", val: totalFundMarket, color: "#ff007f" }
          ]
        };
      }, [krParking, krSavings, vnParking, vnSavings, funds, properties, debts, fx]);

      // Cloud Sync
      const triggerGoogleSync = async () => {
        setSyncStatus("syncing");
        try {
          const payload = {
            netWorthVND: totals.netVND,
            netWorthKRW: totals.netKRW,
            netWorthUSD: totals.netUSD,
            transactions: cashflow,
            sixJars: jars
          };
          await fetch(GOOGLE_APPS_SCRIPT_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          setSyncStatus("synced");
          setTimeout(() => setSyncStatus("idle"), 3000);
        } catch (e) {
          setSyncStatus("fail");
          setTimeout(() => setSyncStatus("idle"), 3000);
        }
      };

      // Edit Locking
      const startEdit = (id, obj) => {
        setEditingId(id);
        setEditForm({ ...obj });
      };
      const cancelEdit = () => {
        setEditingId(null);
        setEditForm({});
      };

      const TABS = {
        dash: lang === "en" ? "Overview" : "대시보드",
        korea: lang === "en" ? "Korea" : "한국 금융",
        vietnam: lang === "en" ? "Vietnam" : "베트남 금융",
        invest: lang === "en" ? "Funds" : "펀드 투자",
        assets: lang === "en" ? "Property" : "실물 자산",
        cashflow: lang === "en" ? "Cashflow" : "수지 기록",
        debt: lang === "en" ? "Debts" : "부채 관리",
        analytics: lang === "en" ? "Analysis" : "종합 분석"
      };

      if (!authed) {
        return (
          <div className="min-h-screen bg-cyberDark flex items-center justify-center p-4">
            <div className="w-full max-w-sm bg-cyberCard border border-cyberBorder rounded-xl p-6 text-center shadow-2xl">
              <h1 className="text-2xl font-black tracking-widest text-white mb-2">Youmelittlepenny</h1>
              <p className="text-xs text-slate-400 mb-6 font-mono">Terminal Authentication</p>
              <form onSubmit={(e) => {
                e.preventDefault();
                if (passInput === "$1Million") {
                  sessionStorage.setItem("auth_pass", "$1Million");
                  setAuthed(true);
                } else alert("Access Denied");
              }} className="space-y-4">
                <input
                  type="password"
                  value={passInput}
                  onChange={(e) => setPassInput(e.target.value)}
                  placeholder="Passcode"
                  className="w-full px-4 py-2.5 text-center text-lg rounded-lg border font-mono tracking-widest"
                  autoFocus
                />
                <button type="submit" className="w-full py-2.5 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-lg font-mono">
                  Authenticate
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-cyberDark text-slate-200">
          {/* HEADER */}
          <header className="border-b border-cyberBorder bg-cyberCard/90 backdrop-blur sticky top-0 z-50 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <h1 className="text-xl font-black tracking-widest text-white">Youmelittlepenny</h1>

              <div className="flex items-center gap-4 text-xs font-mono bg-cyberDark px-3 py-1.5 rounded-lg border border-slate-800">
                <span className="w-2 h-2 rounded-full bg-neonGreen animate-pulse"></span>
                <span>USD/KRW: <b className="text-neonCyan">{fx.USD_KRW}</b></span>
                <span>USD/VND: <b className="text-neonCyan">{fx.USD_VND.toLocaleString()}</b></span>
                <span>KRW/VND: <b className="text-neonCyan">{fx.KRW_VND}</b></span>
              </div>

              <div className="flex items-center gap-3 font-mono text-xs">
                <button
                  onClick={triggerGoogleSync}
                  className={`px-3 py-1.5 rounded font-bold transition ${
                    syncStatus === "syncing" ? "bg-amber-500 text-black animate-pulse" :
                    syncStatus === "synced" ? "bg-neonGreen text-black" :
                    syncStatus === "fail" ? "bg-rose-500 text-white" :
                    "bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30"
                  }`}
                >
                  {syncStatus === "syncing" ? "Syncing..." : syncStatus === "synced" ? "Synced" : syncStatus === "fail" ? "Sync Failed" : "Sync Drive"}
                </button>

                <div className="flex rounded border border-cyberBorder overflow-hidden">
                  <button onClick={() => setLang("en")} className={`px-2 py-1 ${lang === "en" ? "bg-cyan-500 text-black font-bold" : "bg-slate-900 text-slate-400"}`}>EN</button>
                  <button onClick={() => setLang("ko")} className={`px-2 py-1 ${lang === "ko" ? "bg-cyan-500 text-black font-bold" : "bg-slate-900 text-slate-400"}`}>KO</button>
                </div>

                <button onClick={() => { sessionStorage.clear(); setAuthed(false); }} className="text-rose-400 hover:text-rose-300 ml-1">✕</button>
              </div>
            </div>

            <div className="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto mt-3 pt-2 border-t border-slate-800 text-xs font-medium">
              {Object.keys(TABS).map((k) => (
                <button
                  key={k}

                              </div>

                              <div>
                                {isEditing ? (
                                  <input type="text" value={editForm.account} onChange={(e) => setEditForm({ ...editForm, account: e.target.value })} className="w-full px-1 py-0.5 rounded border text-xs" />
                                ) : <span>{c.account}</span>}
                              </div>

                              <div>
                                {isEditing ? (
                                  <input type="text" value={editForm.desc} onChange={(e) => setEditForm({ ...editForm, desc: e.target.value })} className="w-full px-1 py-0.5 rounded border text-xs" />
                                ) : <span className="text-slate-400">{c.desc}</span>}
                              </div>

                              <div className="flex items-center justify-end gap-2">
                                {isEditing ? (
                                  <>
                                    <button onClick={() => {
                                      const updated = cashflow.map(item => item.id === c.id ? { ...editForm } : item);
                                      setCashflow(updated);
                                      cancelEdit();
                                    }} className="px-2 py-0.5 bg-neonGreen text-black font-bold rounded">Save</button>
                                    <button onClick={cancelEdit} className="px-2 py-0.5 bg-slate-800 text-slate-400 rounded">Cancel</button>
                                  </>
                                ) : (
                                  <>
                                    <button onClick={() => startEdit(c.id, c)} className="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded">Edit</button>
                                    <button onClick={() => setCashflow(cashflow.filter(item => item.id !== c.id))} className="text-rose-400 hover:text-rose-300 px-2 py-0.5">Delete</button>
                                  </>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ==================== TAB: DEBTS ==================== */}
            {activeTab === "debt" && (
              <div className="space-y-6">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl p-5 space-y-4 font-mono">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-bold text-rose-400 uppercase">Liabilities & Held Security Deposits</h2>
                      <p className="text-[11px] text-slate-500">Refundable tenant key money and debt obligations</p>
                    </div>
                    <button
                      onClick={() => setDebts([...debts, { id: "d_" + Date.now(), name: "Tenant Deposit", amount: 14000000, currency: "VND", party: "Tenant", dueDate: "2027-05-09" }])}
                      className="text-xs px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded"
                    >
                      + Add Obligation
                    </button>
                  </div>

                  {debts.map((d, dIdx) => {
                    const isEditing = editingId === d.id;
                    return (
                      <div key={d.id} className="border border-slate-800 rounded-lg p-4 bg-cyberDark/60 grid grid-cols-2 md:grid-cols-5 gap-3 text-xs items-center">
                        <div>
                          <span className="text-slate-500 text-[10px] block">Name</span>
                          {isEditing ? (
                            <input type="text" value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} className="w-full px-2 py-1 rounded border font-bold text-white" />
                          ) : <span className="font-bold text-white">{d.name}</span>}
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] block">Party</span>
                          {isEditing ? (
                            <input type="text" value={editForm.party} onChange={(e) => setEditForm({ ...editForm, party: e.target.value })} className="w-full px-2 py-1 rounded border" />
                          ) : <span className="text-slate-300">{d.party}</span>}
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] block">Amount</span>
                          {isEditing ? (
                            <div className="flex gap-1">
                              <input type="number" value={editForm.amount} onChange={(e) => setEditForm({ ...editForm, amount: Number(e.target.value) })} className="w-full px-2 py-1 rounded border text-rose-400 font-bold" />
                              <select value={editForm.currency} onChange={(e) => setEditForm({ ...editForm, currency: e.target.value })} className="w-16 px-1 py-1 rounded border text-xs">
                                <option value="VND">VND</option>
                                <option value="KRW">KRW</option>
                                <option value="USD">USD</option>
                              </select>
                            </div>
                          ) : <span className="font-bold text-rose-400">-{fmt(d.amount, d.currency)}</span>}
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] block">Due Date</span>
                          {isEditing ? (
                            <input type="date" value={editForm.dueDate} onChange={(e) => setEditForm({ ...editForm, dueDate: e.target.value })} className="w-full px-2 py-1 rounded border text-xs" />
                          ) : <span>{d.dueDate}</span>}
                        </div>
                        <div className="flex items-center justify-end gap-2">
                          {isEditing ? (
                            <>
                              <button onClick={() => {
                                const updated = [...debts];
                                updated[dIdx] = { ...editForm };
                                setDebts(updated);
                                cancelEdit();
                              }} className="px-2 py-1 bg-neonGreen text-black font-bold rounded">Save</button>
                              <button onClick={cancelEdit} className="px-2 py-1 bg-slate-800 text-slate-400 rounded">Cancel</button>
                            </>
                          ) : (
                            <>
                              <button onClick={() => startEdit(d.id, d)} className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded">Edit</button>
                              <button onClick={() => setDebts(debts.filter((_, idx) => idx !== dIdx))} className="text-rose-400 hover:text-rose-300 px-2 py-1">Delete</button>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ==================== TAB: 6 JARS ANALYSIS ==================== */}
            {activeTab === "analytics" && (
              <div className="space-y-6">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl p-5 space-y-4 font-mono">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-bold text-neonCyan uppercase">6 Jars System Performance</h2>
                      <p className="text-[11px] text-slate-500">Expenditure tracking across predefined percentage pots</p>
                    </div>
                    <button
                      onClick={() => setShowJarModal(true)}
                      className="text-xs px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 rounded"
                    >
                      ⚙️ Configure Jars & %
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {jars.map(j => {
                      const spent = cashflow.filter(c => c.jarId === j.id && c.type === "Expense").reduce((sum, c) => sum + toVND(c.amount, c.currency), 0);
                      return (
                        <div key={j.id} className="p-4 bg-cyberDark/60 rounded border border-slate-800 space-y-2 text-xs">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-white text-sm">{lang === "en" ? j.nameEn : j.nameKo}</span>
                            <span className="text-neonCyan font-bold">Target: {j.pct}%</span>
                          </div>
                          <div className="flex justify-between text-slate-400">
                            <span>Total Spent:</span>
                            <span className="text-neonPink font-bold">{fmt(spent, "VND")}</span>
                          </div>
                          <div className="text-[11px] text-slate-500">
                            Registered Categories: {j.categories.map(c => c[lang]).join(", ")}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 6 JARS CONFIGURATION MODAL ==================== */}
            {showJarModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 font-mono">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto text-xs">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h2 className="text-sm font-bold text-neonCyan uppercase">Configure 6 Jars & Categories</h2>
                    <button onClick={() => setShowJarModal(false)} className="text-slate-400 hover:text-white">✕</button>
                  </div>

                  <div className="space-y-4">
                    {jars.map((j, jIdx) => (
                      <div key={j.id} className="p-3 bg-cyberDark rounded border border-slate-800 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-white">{lang === "en" ? j.nameEn : j.nameKo}</span>
                          <div className="flex items-center gap-2">
                            <span>Target %:</span>
                            <input
                              type="number"
                              value={j.pct}
                              onChange={(e) => {
                                const updated = [...jars];
                                updated[jIdx].pct = Number(e.target.value);
                                setJars(updated);
                              }}
                              className="w-16 px-1.5 py-0.5 rounded border text-neonCyan font-bold text-center"
                            />
                          </div>
                        </div>

                        <div className="flex flex-wrap gap-1.5 pt-2">
                          {j.categories.map((c, cIdx) => (
                            <span key={c.id} className="px-2 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300 flex items-center gap-1.5 text-[11px]">
                              {lang === "en" ? c.en : c.ko}
                              <button onClick={() => {
                                const updated = [...jars];
                                updated[jIdx].categories = updated[jIdx].categories.filter((_, i) => i !== cIdx);
                                setJars(updated);
                              }} className="text-slate-500 hover:text-rose-400">✕</button>
                            </span>
                          ))}
                          <button
                            onClick={() => {
                              const nameEn = prompt("Category English name:", "New Category");
                              const nameKo = prompt("Category Korean name:", "새 카테고리");
                              if (nameEn && nameKo) {
                                const updated = [...jars];
                                updated[jIdx].categories.push({ id: "cat_" + Date.now(), en: nameEn, ko: nameKo });
                                setJars(updated);
                              }
                            }}
                            className="text-cyan-400 hover:underline px-2 py-0.5"
                          >
                            + Add Category
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="pt-3 border-t border-slate-800 text-right">
                    <button onClick={() => setShowJarModal(false)} className="px-4 py-2 bg-neonGreen text-black font-bold rounded">
                      Close & Apply
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
