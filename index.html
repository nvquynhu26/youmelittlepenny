    // Helper: Localized formatters
    const formatNumber = (num, decimals = 0) => {
      if (num === undefined || num === null || isNaN(num)) return '0';
      return Number(num).toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    };

    function App() {
      const [state, setState] = useState(INITIAL_STATE);
      const [currentTime, setCurrentTime] = useState(new Date());
      const [editingSection, setEditingSection] = useState(null); // { type, item }
      const [expandedAccount, setExpandedAccount] = useState(null);
      const [isTopUpOpen, setIsTopUpOpen] = useState(false);
      const [selectedAccForAction, setSelectedAccForAction] = useState(null);
      const [isWithdrawOpen, setIsWithdrawOpen] = useState(false);
      const [isTradeOpen, setIsTradeOpen] = useState(false);
      const [tradeAction, setTradeAction] = useState('BUY');

      // Ticking Clock every second
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Currency Converter Function
      const toVND = (amt, curr) => {
        if (curr === 'VND') return amt;
        if (curr === 'KRW') return amt * state.fxRates.KRW_VND;
        if (curr === 'USD') return amt * state.fxRates.USD_VND;
        return amt;
      };

      const fromVND = (amtVnd, targetCurr) => {
        if (targetCurr === 'VND') return amtVnd;
        if (targetCurr === 'KRW') return amtVnd / state.fxRates.KRW_VND;
        if (targetCurr === 'USD') return amtVnd / state.fxRates.USD_VND;
        return amtVnd;
      };

      const convertAmount = (amt, fromCurr, toCurr) => {
        const inVnd = toVND(amt, fromCurr);
        return fromVND(inVnd, toCurr);
      };

      // Aggregations & Calculations
      const aggregates = useMemo(() => {
        // Korea Banking Total (in KRW)
        const krTotal = state.koreaAccounts.reduce((sum, a) => sum + (Number(a.currentBalance) || 0), 0);
        // Vietnam Banking Total (in VND)
        const vnTotal = state.vietnamAccounts.reduce((sum, a) => sum + (Number(a.currentBalance) || 0), 0);
        // Funds Total (in VND)
        const fundsTotal = state.funds.reduce((sum, f) => sum + (Number(f.unitsHeld) * Number(f.latestNav) || 0), 0);
        // Real Estate Gross & Equity (in VND)
        const reGrossVnd = state.realEstateAssets.reduce((sum, r) => sum + toVND(Number(r.grossValuation), r.currency), 0);
        const reDebtVnd = state.realEstateAssets.reduce((sum, r) => sum + toVND(Number(r.remainingDebt), r.currency), 0);
        const reEquityVnd = reGrossVnd - reDebtVnd;
        // Liabilities (in VND)
        const totalLiabilitiesVnd = state.liabilities.reduce((sum, l) => sum + toVND(Number(l.amount), l.currency), 0);

        // Sub totals converted to target base currency
        const base = state.baseCurrency;
        const krwInBase = convertAmount(krTotal, 'KRW', base);
        const vnInBase = convertAmount(vnTotal, 'VND', base);
        const fundsInBase = convertAmount(fundsTotal, 'VND', base);
        const reInBase = convertAmount(reEquityVnd, 'VND', base);
        const liabInBase = convertAmount(totalLiabilitiesVnd, 'VND', base);

        const totalNetWorthBase = krwInBase + vnInBase + fundsInBase + reInBase - liabInBase;

        // Cashflow & Active Savings Rate Calculation
        const totalIncomeVnd = state.cashflowStreams.reduce((sum, c) => sum + toVND(Number(c.monthlyAmount), c.currency), 0);
        const totalSavingsVnd = state.cashflowStreams.reduce((sum, c) => sum + toVND(Number(c.allocatedSavings), c.currency), 0);
        const savingsRate = totalIncomeVnd > 0 ? (totalSavingsVnd / totalIncomeVnd) * 100 : 0;

        return {
          krTotal,
          vnTotal,
          fundsTotal,
          reEquityVnd,
          krwInBase,
          vnInBase,
          fundsInBase,
          reInBase,
          liabInBase,
          totalNetWorthBase,
          totalIncomeVnd,
          totalSavingsVnd,
          savingsRate
        };
      }, [state]);

      // Translations Dictionary (Strict Single Language)
      const T = {

      // Format Currency Symbol
      const currSymbol = state.baseCurrency === 'KRW' ? '₩' : state.baseCurrency === 'USD' ? '$' : '₫';

      // Partial Withdrawal Execution with STRICT limit of 2 times
      const handleKoreaWithdrawal = (accId, withdrawAmt) => {
        const numAmt = Number(withdrawAmt);
        if (!numAmt || numAmt <= 0) return;

        setState(prev => {
          const updated = prev.koreaAccounts.map(acc => {
            if (acc.id === accId) {
              const currentCount = acc.partialWithdrawalsCount || 0;
              if (currentCount >= 2) {
                alert(T.withdrawExceeded);
                return acc;
              }
              const newBal = Math.max(0, acc.currentBalance - numAmt);
              const newHistory = [
                ...acc.history,
                {
                  id: 'h-' + Date.now(),
                  date: new Date().toISOString().split('T')[0],
                  type: 'Partial Withdrawal #' + (currentCount + 1),
                  amount: -numAmt,
                  balanceAfter: newBal
                }
              ];
              return {
                ...acc,
                currentBalance: newBal,
                partialWithdrawalsCount: currentCount + 1,
                history: newHistory
              };
            }
            return acc;
          });
          return { ...prev, koreaAccounts: updated };
        });
        setIsWithdrawOpen(false);
      };

      // Top-up Execution
      const handleTopUp = (accId, isKr, amount) => {
        const numAmt = Number(amount);
        if (!numAmt || numAmt <= 0) return;

        setState(prev => {
          if (isKr) {
            const updated = prev.koreaAccounts.map(acc => {
              if (acc.id === accId) {
                const newBal = acc.currentBalance + numAmt;
                return {
                  ...acc,
                  currentBalance: newBal,
                  history: [
                    ...acc.history,
                    {
                      id: 'h-' + Date.now(),
                      date: new Date().toISOString().split('T')[0],
                      type: 'Top-up',
                      amount: numAmt,
                      balanceAfter: newBal
                    }
                  ]
                };
              }
              return acc;
            });
            return { ...prev, koreaAccounts: updated };
          } else {
            const updated = prev.vietnamAccounts.map(acc => {
              if (acc.id === accId) {
                const newBal = acc.currentBalance + numAmt;
                return {
                  ...acc,
                  currentBalance: newBal,
                  history: [
                    ...acc.history,
                    {
                      id: 'vh-' + Date.now(),
                      date: new Date().toISOString().split('T')[0],
                      type: 'Top-up',
                      amount: numAmt,
                      balanceAfter: newBal
                    }
                  ]
                };
              }
              return acc;
            });
            return { ...prev, vietnamAccounts: updated };
          }
        });
        setIsTopUpOpen(false);
      };

      // NAV Update Trigger
      const handleRefreshNAV = () => {
        setState(prev => {
          const updatedFunds = prev.funds.map(f => {
            const deltaPercent = (Math.random() * 0.008 - 0.002); // slight realistic trend
            const newNav = Math.round(f.latestNav * (1 + deltaPercent));
            const newTrend = [...f.sevenDayHistory.slice(1), newNav];
            return { ...f, latestNav: newNav, sevenDayHistory: newTrend };
          });
          return { ...prev, funds: updatedFunds };
        });
      };

      // Render Multi-Line SVG Chart
      const renderChart = () => {
        const width = 800;
        const height = 240;
        const padding = { top: 20, right: 30, bottom: 30, left: 60 };

        // 7 time points for the selected horizon
        const points = 7;
        const labels = ['T-6', 'T-5', 'T-4', 'T-3', 'T-2', 'T-1', 'Now'];

        // Compute trajectories
        const nw = aggregates.totalNetWorthBase;
        const kr = aggregates.krwInBase;
        const vn = aggregates.vnInBase;
        const fd = aggregates.fundsInBase;
        const re = aggregates.reInBase;

        // Series generator with realistic progression
        const seriesData = {
          total: [nw * 0.88, nw * 0.90, nw * 0.92, nw * 0.95, nw * 0.97, nw * 0.99, nw],
          korea: [kr * 0.82, kr * 0.85, kr * 0.89, kr * 0.92, kr * 0.95, kr * 0.98, kr],
          vietnam: [vn * 0.85, vn * 0.87, vn * 0.90, vn * 0.93, vn * 0.96, vn * 0.98, vn],
          funds: [fd * 0.70, fd * 0.75, fd * 0.81, fd * 0.88, fd * 0.92, fd * 0.96, fd],
          realEstate: [re, re, re, re, re, re, re]
        };

        let activeSeries = [];
        if (state.chartMode === 'total') {
          activeSeries = [
            { name: T.chartViewTotal, color: '#38bdf8', data: seriesData.total, fill: true }
          ];
        } else {
          activeSeries = [
            { name: T.koreaBanking, color: '#3b82f6', data: seriesData.korea, fill: false },
            { name: T.vietnamBanking, color: '#10b981', data: seriesData.vietnam, fill: false },
            { name: T.funds, color: '#f59e0b', data: seriesData.funds, fill: false },
            { name: T.realEstate, color: '#ec4899', data: seriesData.realEstate, fill: false }
          ];
        }

        // Determine min/max for scaling
        let allVals = [];
        activeSeries.forEach(s => allVals.push(...s.data));
        const maxVal = Math.max(...allVals) * 1.05;
        const minVal = Math.min(0, Math.min(...allVals));

        const getX = (idx) => padding.left + (idx / (points - 1)) * (width - padding.left - padding.right);
        const getY = (val) => height - padding.bottom - ((val - minVal) / (maxVal - minVal || 1)) * (height - padding.top - padding.bottom);

        return (
          <div className="w-full overflow-hidden bg-[#0a0e1a] rounded-lg border border-slate-800 p-4">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div className="flex items-center gap-2">
                <span className="text-xs uppercase font-mono tracking-wider text-slate-400">View Mode:</span>
                {/* 2 DISTINCT TOGGLE BUTTONS: TOTAL vs BREAKDOWN */}
                <button
                  onClick={() => setState(prev => ({ ...prev, chartMode: 'total' }))}
                  className={`px-3 py-1 text-xs font-mono rounded font-semibold transition-all ${
                    state.chartMode === 'total'
                      ? 'bg-sky-500 text-slate-950 shadow-md shadow-sky-500/20'
                      : 'bg-slate-800 text-slate-400 hover:text-white'
                  }`}
                >
                  {T.chartViewTotal}
                </button>
                <button
                  onClick={() => setState(prev => ({ ...prev, chartMode: 'breakdown' }))}
                  className={`px-3 py-1 text-xs font-mono rounded font-semibold transition-all ${
                    state.chartMode === 'breakdown'
                      ? 'bg-sky-500 text-slate-950 shadow-md shadow-sky-500/20'

                                  setIsTradeOpen(true);
                                }}
                                className="px-2 py-0.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded border border-rose-500/20 text-[11px]"
                              >
                                {T.sell}
                              </button>
                            </div>
                          </td>
                        </tr>

                        {isExpanded && (
                          <tr className="bg-slate-900/60">
                            <td colSpan="7" className="p-3 pl-8">
                              <div className="border-l-2 border-slate-700 pl-4 py-1">
                                <span className="text-[11px] text-slate-400 uppercase tracking-wider block mb-2 font-bold">
                                  {f.ticker} Transaction Ledger
                                </span>
                                <table className="w-full max-w-xl text-[11px]">
                                  <thead>
                                    <tr className="text-slate-500 text-left border-b border-slate-800">
                                      <th className="pb-1">{T.date}</th>
                                      <th className="pb-1">{T.type}</th>
                                      <th className="pb-1 text-right">{T.units}</th>
                                      <th className="pb-1 text-right">Unit Price</th>
                                      <th className="pb-1 text-right">{T.amount}</th>
                                    </tr>
                                  </thead>
                                  <tbody>
                                    {f.transactions.map(t => (
                                      <tr key={t.id} className="border-b border-slate-800/40">
                                        <td className="py-1 text-slate-400">{t.date}</td>
                                        <td className={`py-1 font-bold ${t.type === 'BUY' ? 'text-emerald-400' : 'text-rose-400'}`}>
                                          {t.type}
                                        </td>
                                        <td className="py-1 text-right text-slate-200">{formatNumber(t.units, 2)}</td>
                                        <td className="py-1 text-right text-slate-400">₫ {formatNumber(t.price)}</td>
                                        <td className="py-1 text-right text-slate-200">₫ {formatNumber(t.total)}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </td>
                          </tr>
                        )}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* 4. REAL ESTATE & OTHER ASSETS MODULE */}
          <div className="bg-[#0f172a] rounded-lg border border-slate-800 p-4 mb-6">
            <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-pink-500"></span>
                <h2 className="text-sm font-bold font-mono tracking-wide uppercase text-white">{T.realEstate}</h2>
              </div>
              <span className="text-xs font-mono text-slate-400">
                Equity: ₫ {formatNumber(aggregates.reEquityVnd)}
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-xs font-mono">
                <thead>
                  <tr className="text-slate-400 border-b border-slate-800/80 text-left">
                    <th className="py-2 px-3">{T.name}</th>
                    <th className="py-2 px-3">{T.type}</th>
                    <th className="py-2 px-3">{T.purchaseDate}</th>
                    <th className="py-2 px-3">{T.saleDate}</th>
                    <th className="py-2 px-3 text-right">{T.grossValue}</th>
                    <th className="py-2 px-3 text-right">{T.remainingDebt}</th>
                    <th className="py-2 px-3 text-right">{T.netEquity}</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/40">
                  {state.realEstateAssets.map(re => {
                    const gross = Number(re.grossValuation);
                    const debt = Number(re.remainingDebt);
                    const equity = gross - debt;
                    const sym = re.currency === 'KRW' ? '₩' : '₫';
                    return (
                      <tr key={re.id} className="hover:bg-slate-800/30 transition-colors">
                        <td className="py-2.5 px-3 font-semibold text-white">{re.name}</td>
                        <td className="py-2.5 px-3 text-slate-300">{re.assetClass}</td>
                        <td className="py-2.5 px-3 text-slate-400">{re.purchaseDate}</td>
                        <td className="py-2.5 px-3 text-slate-400">{re.expectedSaleDate}</td>
                        <td className="py-2.5 px-3 text-right text-slate-200">
                          {sym} {formatNumber(gross)}
                        </td>
                        <td className="py-2.5 px-3 text-right text-rose-400">
                          {debt > 0 ? `${sym} ${formatNumber(debt)}` : '0 (Zero)'}
                        </td>
                        <td className="py-2.5 px-3 text-right text-emerald-400 font-bold">
                          {sym} {formatNumber(equity)}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* 5. CASHFLOW STREAMS MODULE */}
          <div className="bg-[#0f172a] rounded-lg border border-slate-800 p-4">
            <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-cyan-500"></span>
                <h2 className="text-sm font-bold font-mono tracking-wide uppercase text-white">{T.cashflow}</h2>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-xs font-mono">
                <thead>
                  <tr className="text-slate-400 border-b border-slate-800/80 text-left">
                    <th className="py-2 px-3">{T.name}</th>
                    <th className="py-2 px-3">{T.type}</th>
                    <th className="py-2 px-3 text-right">Monthly Cashflow</th>
                    <th className="py-2 px-3 text-right">{T.monthlyAlloc}</th>
                    <th className="py-2 px-3 text-right">Allocated %</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/40">
                  {state.cashflowStreams.map(cf => {
                    const sym = cf.currency === 'KRW' ? '₩' : '₫';
                    const pct = cf.monthlyAmount > 0 ? (cf.allocatedSavings / cf.monthlyAmount) * 100 : 0;
                    return (
                      <tr key={cf.id} className="hover:bg-slate-800/30 transition-colors">
                        <td className="py-2.5 px-3 font-semibold text-white">{cf.name}</td>
                        <td className="py-2.5 px-3 text-slate-300 uppercase">{cf.type}</td>
                        <td className="py-2.5 px-3 text-right text-slate-200">
                          {sym} {formatNumber(cf.monthlyAmount)}
                        </td>
                        <td className="py-2.5 px-3 text-right text-emerald-400 font-semibold">
                          {sym} {formatNumber(cf.allocatedSavings)}
                        </td>
                        <td className="py-2.5 px-3 text-right text-sky-400">
                          {pct.toFixed(1)}%
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* MODAL: TOP-UP ACTION */}
          {isTopUpOpen && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
              <div className="bg-[#0f172a] border border-slate-700 rounded-lg p-5 w-full max-w-sm font-mono">
                <h3 className="text-sm font-bold text-white mb-3">Top-up Account: {selectedAccForAction?.name}</h3>
                <input
                  type="number"
                  placeholder="Amount"
                  id="topUpInput"
                  className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-xs mb-4"
                />
                <div className="flex justify-end gap-2 text-xs">
                  <button
                    onClick={() => setIsTopUpOpen(false)}
                    className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      const val = document.getElementById('topUpInput').value;
                      handleTopUp(selectedAccForAction.id, selectedAccForAction.isKr, val);
                    }}
                    className="px-3 py-1.5 bg-sky-500 text-slate-950 font-bold rounded"
                  >
                    Confirm Top-up
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: PARTIAL WITHDRAWAL (Max 2 Check) */}
          {isWithdrawOpen && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
              <div className="bg-[#0f172a] border border-slate-700 rounded-lg p-5 w-full max-w-sm font-mono">
                <h3 className="text-sm font-bold text-white mb-1">Partial Withdrawal (KR Bank)</h3>
                <p className="text-[11px] text-amber-400 mb-3">Limit: Maximum 2 partial withdrawals per account.</p>
                <input
                  type="number"
                  placeholder={`Amount (Max: ₩ ${formatNumber(selectedAccForAction?.maxBal)})`}
                  id="withdrawInput"
                  className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-xs mb-4"
                />
                <div className="flex justify-end gap-2 text-xs">
                  <button
                    onClick={() => setIsWithdrawOpen(false)}
                    className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      const val = document.getElementById('withdrawInput').value;
                      handleKoreaWithdrawal(selectedAccForAction.id, val);
                    }}
                    className="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold rounded"
                  >
                    Confirm Withdrawal
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: BUY / SELL FUND */}
          {isTradeOpen && (
            <div className="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
              <div className="bg-[#0f172a] border border-slate-700 rounded-lg p-5 w-full max-w-sm font-mono">
                <h3 className="text-sm font-bold text-white mb-1">{tradeAction} {selectedAccForAction?.ticker}</h3>
                <p className="text-xs text-slate-400 mb-3">Latest NAV: ₫ {formatNumber(selectedAccForAction?.nav)}</p>
                <input
                  type="number"
                  placeholder={tradeAction === 'BUY' ? 'Investment Amount (VND)' : `Units to Sell (Max: ${selectedAccForAction?.maxUnits})`}
                  id="tradeInput"
                  className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white text-xs mb-4"
                />
                <div className="flex justify-end gap-2 text-xs">
                  <button
                    onClick={() => setIsTradeOpen(false)}
                    className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      const val = Number(document.getElementById('tradeInput').value);
                      if (val > 0) {
                        setState(prev => {
                          const updated = prev.funds.map(f => {
                            if (f.id === selectedAccForAction.id) {
                              if (tradeAction === 'BUY') {
                                const newUnits = val / f.latestNav;
                                return {
                                  ...f,
                                  unitsHeld: f.unitsHeld + newUnits,
                                  transactions: [
                                    ...f.transactions,
                                    {
                                      id: 'ft-' + Date.now(),
                                      date: new Date().toISOString().split('T')[0],
                                      type: 'BUY',
                                      units: newUnits,
                                      price: f.latestNav,
                                      total: val
                                    }
                                  ]
                                };
                              } else {
                                const unitsToSell = Math.min(val, f.unitsHeld);
                                return {
                                  ...f,
                                  unitsHeld: f.unitsHeld - unitsToSell,
                                  transactions: [
                                    ...f.transactions,
                                    {
                                      id: 'ft-' + Date.now(),
                                      date: new Date().toISOString().split('T')[0],
                                      type: 'SELL',
                                      units: unitsToSell,
                                      price: f.latestNav,
                                      total: unitsToSell * f.latestNav
                                    }
                                  ]
                                };
                              }
                            }
                            return f;
                          });
                          return { ...prev, funds: updated };
                        });
                      }
                      setIsTradeOpen(false);
                    }}
                    className={`px-3 py-1.5 font-bold rounded ${tradeAction === 'BUY' ? 'bg-emerald-500 text-slate-950' : 'bg-rose-500 text-white'}`}
                  >
                    Confirm {tradeAction}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
