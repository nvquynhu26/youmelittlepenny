<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youmelittlepenny</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyberDark: '#05070a',
            cyberCard: '#0b0f19',
            cyberBorder: '#1e293b',
            neonGreen: '#00ff66',
            neonCyan: '#00f0ff',
            neonPink: '#ff007f',
            neonYellow: '#ffe600'
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #05070a; color: #f1f5f9; }
    .neon-glow-cyan { text-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
    .neon-glow-green { text-shadow: 0 0 12px rgba(0, 255, 102, 0.4); }
    input, select, textarea {
      background-color: #07090e !important;
      border-color: #1e293b !important;
      color: #f8fafc !important;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00f0ff !important;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.25);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // ⚙️ GAS DEPLOYMENT URL (PASTE HERE)
    // ==========================================
    const GOOGLE_APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzP7xhlbrMqSy_7ZrVNDNSh9drGYFGc3WVQZEF1ZVcF21DjLThvLYjyEBAjHvOh2AOm4Q/exec";

    const DEFAULT_JARS = [
      {
        id: "NEC",
        pct: 55,
        nameEn: "Necessities (55%)",
        nameKo: "생활비 / 필수지출 (55%)",
        categories: [
          { id: "nec_rent", en: "Rent / Housing", ko: "주거비 / 월세" },
          { id: "nec_util", en: "Utilities (Power/Water/Internet)", ko: "공과금 (수도·광열·관리비)" },
          { id: "nec_groc", en: "Groceries", ko: "식비 / 장보기" },
          { id: "nec_dine", en: "Daily Dining", ko: "외식비" },
          { id: "nec_tran", en: "Transportation", ko: "교통비" },
          { id: "nec_tele", en: "Phone / Telecom", ko: "통신비" },
          { id: "nec_insu", en: "Insurance", ko: "보험료" },
          { id: "nec_heal", en: "Healthcare / Medical", ko: "의료비" }
        ]
      },
      {
        id: "LTSS",
        pct: 10,
        nameEn: "Long-term Savings (10%)",
        nameKo: "장기저축 / 목돈마련 (10%)",
        categories: [
          { id: "lts_emg", en: "Emergency Fund", ko: "비상금" },
          { id: "lts_maj", en: "Major Purchases", ko: "대형지출 적립" },
          { id: "lts_rain", en: "Rainy-day Savings", ko: "예비비" }
        ]
      },
      {
        id: "EDU",
        pct: 10,
        nameEn: "Education (10%)",
        nameKo: "자기계발 / 교육비 (10%)",
        categories: [
          { id: "edu_tui", en: "Courses / Tuition", ko: "강의료 / 학비" },
          { id: "edu_book", en: "Books / Resources", ko: "도서구입비" },
          { id: "edu_lang", en: "Language Learning", ko: "어학학습비" },
          { id: "edu_tool", en: "Seminars / Tools", ko: "세미나 / 학습툴" }
        ]
      },
      {
        id: "FFA",
        pct: 10,
        nameEn: "Financial Freedom (10%)",
        nameKo: "재테크 / 투자 (10%)",
        categories: [
          { id: "ffa_stk", en: "Stocks / ETFs / CCQ", ko: "주식 / ETF / CCQ" },
          { id: "ffa_pen", en: "Retirement / Pension", ko: "연금 / IRP" },
          { id: "ffa_gro", en: "Growth Investments", ko: "투자원금" }
        ]
      },
      {
        id: "PLAY",
        pct: 10,
        nameEn: "Play & Leisure (10%)",
        nameKo: "문화·여가 / 플렉스 (10%)",
        categories: [
          { id: "ply_cafe", en: "Cafés & Socializing", ko: "카페 / 사교" },
          { id: "ply_ent", en: "Hobbies & Entertainment", ko: "취미 / 문화생활" },
          { id: "ply_trav", en: "Travel / Vacations", ko: "여행 / 휴가" },
          { id: "ply_shop", en: "Personal Shopping", ko: "쇼핑 / 기분전환" }
        ]
      },
      {
        id: "GIVE",
        pct: 5,
        nameEn: "Give (5%)",
        nameKo: "기부 / 경조사 (5%)",
        categories: [
          { id: "giv_dona", en: "Donations / Charity", ko: "기부금 / 후원" },
          { id: "giv_fam", en: "Family & Gifts", ko: "가족용돈 / 선물" },
          { id: "giv_soc", en: "Social Obligations", ko: "경조사비" }
        ]
      }
    ];

    const KOREA_BANKS = ["Toss Bank", "KakaoBank", "Kookmin KB", "Shinhan", "Hana", "Woori", "K-Bank"];
    const VN_BANKS = ["MBBank", "Techcombank", "Vietcombank", "VPBank", "ACB", "TPBank"];

    function App() {
      const [authed, setAuthed] = useState(() => sessionStorage.getItem("auth_pass") === "$1Million");
      const [passInput, setPassInput] = useState("");
      const [lang, setLang] = useState("en");
      const [activeTab, setActiveTab] = useState("dash");
      const [syncStatus, setSyncStatus] = useState("idle");

      const [editingId, setEditingId] = useState(null);
      const [editForm, setEditForm] = useState({});

      const [fx, setFx] = useState({ USD_KRW: 1385, USD_VND: 25420, KRW_VND: 18.35 });

      useEffect(() => {
        async function fetchRates() {
          try {
            const res = await fetch("https://open.er-api.com/v6/latest/USD");
            const data = await res.json();
            if (data && data.rates) {
              const u_krw = data.rates.KRW || 1385;
              const u_vnd = data.rates.VND || 25420;
              setFx({
                USD_KRW: Math.round(u_krw * 100) / 100,
                USD_VND: Math.round(u_vnd),
                KRW_VND: Math.round((u_vnd / u_krw) * 100) / 100
              });
            }
          } catch (e) {
            console.warn("Using offline FX fallback", e);
          }
        }
        fetchRates();
      }, []);

      const [jars, setJars] = useState(() => {
        const saved = localStorage.getItem("pen_jars");
        return saved ? JSON.parse(saved) : DEFAULT_JARS;
      });
      const [showJarModal, setShowJarModal] = useState(false);

      const [krParking, setKrParking] = useState(() => {
        const saved = localStorage.getItem("pen_kr_parking");
        return saved ? JSON.parse(saved) : [
          { id: "kp1", bank: "Toss Bank", name: "Main Parking", balance: 500000, rate: 2.0, subPots: [{ id: "sp1", name: "Savings Spillover", balance: 75000 }] }
        ];
      });

      const [krSavings, setKrSavings] = useState(() => {
        const saved = localStorage.getItem("pen_kr_savings");
        return saved ? JSON.parse(saved) : [
          { id: "ks1", bank: "Hana", name: "Jeonse Key Money", type: "yegeum", principal: 9000000, currentPrincipal: 9000000, rate: 3.0, taxRate: 15.4, startDate: "2026-05-09", maturityDate: "2027-05-09", destination: "kp1", earlyWithdrawals: [] },
          { id: "ks2", bank: "Toss Bank", name: "PhD Study Fund", type: "jeokgeum", principal: 865000, currentPrincipal: 865000, rate: 1.4, taxRate: 15.4, startDate: "2026-01-01", maturityDate: "2027-05-09", destination: "kp1", earlyWithdrawals: [] }
        ];
      });

      const [vnParking, setVnParking] = useState(() => {
        const saved = localStorage.getItem("pen_vn_parking");
        return saved ? JSON.parse(saved) : [
          { id: "vp1", bank: "MBBank", name: "Spending Account", balance: 3000000, rate: 0.2 }
        ];
      });

      const [vnSavings, setVnSavings] = useState(() => {
        const saved = localStorage.getItem("pen_vn_savings");
        return saved ? JSON.parse(saved) : [
          { id: "vs1", bank: "MBBank", name: "Annual Target May 9", type: "fixed", principal: 7000000, currentPrincipal: 7000000, rate: 4.3, startDate: "2026-05-09", maturityDate: "2027-05-09", destination: "vp1", earlyRate: 0.2 },
          { id: "vs2", bank: "MBBank", name: "Tenant Deposit Ringfence", type: "fixed", principal: 14000000, currentPrincipal: 14000000, rate: 6.2, startDate: "2026-05-09", maturityDate: "2027-05-09", destination: "vp1", earlyRate: 0.2 }
        ];
      });

      const [funds, setFunds] = useState(() => {
        const saved = localStorage.getItem("pen_funds");
        return saved ? JSON.parse(saved) : [
          { id: "f1", code: "MBBOND", units: 45.45, buyNav: 22000, currentNav: 22410, history: [22000, 22150, 22280, 22410] },
          { id: "f2", code: "MBVF", units: 33.33, buyNav: 15000, currentNav: 15280, history: [15000, 15100, 15200, 15280] }
        ];
      });

      const [properties, setProperties] = useState(() => {
        const saved = localStorage.getItem("pen_properties");
        return saved ? JSON.parse(saved) : [
          { id: "p1", name: "HCMC Mid Apartment (95% Paid)", type: "Real Estate", address: "Ho Chi Minh City", buyDate: "2024-01-10", buyPrice: 2000000000, currency: "VND", valuation: 2000000000, fundedFrom: "None" },
          { id: "p2", name: "Seoul Housing Key Money (Deposit)", type: "Deposit", address: "Seoul, Korea", buyDate: "2024-05-01", buyPrice: 8000000, currency: "KRW", valuation: 8000000, fundedFrom: "None" }
        ];
      });

      const [debts, setDebts] = useState(() => {
        const saved = localStorage.getItem("pen_debts");
        return saved ? JSON.parse(saved) : [
          { id: "d1", name: "Tenant Security Deposit", amount: 14000000, currency: "VND", party: "Tenant Room 102", dueDate: "2027-05-09", note: "Held in bank deposit" }
        ];
      });

      const [cashflow, setCashflow] = useState(() => {
        const saved = localStorage.getItem("pen_cashflow");
        return saved ? JSON.parse(saved) : [
          { id: "c1", date: "2026-11-01", type: "Income", jarId: "FFA", catId: "ffa_gro", amount: 2414477, currency: "KRW", account: "Toss Bank", desc: "Design Studio Seoul", fee: 0 },
          { id: "c2", date: "2026-11-01", type: "Income", jarId: "FFA", catId: "ffa_gro", amount: 7300000, currency: "VND", account: "MBBank", desc: "Apartment Rent", fee: 0 },
          { id: "c3", date: "2026-11-05", type: "Expense", jarId: "EDU", catId: "edu_lang", amount: 3300000, currency: "VND", account: "MBBank", desc: "Spanish Class", fee: 0 },
          { id: "c4", date: "2026-11-05", type: "Expense", jarId: "NEC", catId: "nec_rent", amount: 1164000, currency: "KRW", account: "Toss Bank", desc: "Living Expenses", fee: 0 }
        ];
      });

      useEffect(() => { localStorage.setItem("pen_jars", JSON.stringify(jars)); }, [jars]);
      useEffect(() => { localStorage.setItem("pen_kr_parking", JSON.stringify(krParking)); }, [krParking]);
      useEffect(() => { localStorage.setItem("pen_kr_savings", JSON.stringify(krSavings)); }, [krSavings]);
      useEffect(() => { localStorage.setItem("pen_vn_parking", JSON.stringify(vnParking)); }, [vnParking]);
      useEffect(() => { localStorage.setItem("pen_vn_savings", JSON.stringify(vnSavings)); }, [vnSavings]);
      useEffect(() => { localStorage.setItem("pen_funds", JSON.stringify(funds)); }, [funds]);
      useEffect(() => { localStorage.setItem("pen_properties", JSON.stringify(properties)); }, [properties]);
      useEffect(() => { localStorage.setItem("pen_debts", JSON.stringify(debts)); }, [debts]);
      useEffect(() => { localStorage.setItem("pen_cashflow", JSON.stringify(cashflow)); }, [cashflow]);

      const toVND = (val, cur) => cur === "VND" ? val : cur === "KRW" ? val * fx.KRW_VND : val * fx.USD_VND;
      const toKRW = (val, cur) => cur === "KRW" ? val : cur === "VND" ? val / fx.KRW_VND : val * fx.USD_KRW;
      const toUSD = (val, cur) => cur === "USD" ? val : cur === "VND" ? val / fx.USD_VND : val / fx.USD_KRW;

      const fmt = (val, cur) => {
        if (!val || isNaN(val)) return "0";
        if (cur === "VND") return Math.round(val).toLocaleString() + " ₫";
        if (cur === "KRW") return Math.round(val).toLocaleString() + " ₩";
        if (cur === "USD") return "$" + Number(val).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return Number(val).toLocaleString();
      };

      const totals = useMemo(() => {
        const krCash = krParking.reduce((sum, p) => sum + p.balance + (p.subPots || []).reduce((spSum, sp) => spSum + sp.balance, 0), 0);
        const krDeposit = krSavings.reduce((sum, s) => sum + s.currentPrincipal, 0);
        const vnCash = vnParking.reduce((sum, p) => sum + p.balance, 0);
        const vnDeposit = vnSavings.reduce((sum, s) => sum + s.currentPrincipal, 0);
        const fundVND = funds.reduce((sum, f) => sum + (f.units * f.currentNav), 0);
        const propVND = properties.reduce((sum, p) => sum + toVND(p.valuation, p.currency), 0);
        const debtVND = debts.reduce((sum, d) => sum + toVND(d.amount, d.currency), 0);

        const assetsVND = toVND(krCash + krDeposit, "KRW") + vnCash + vnDeposit + fundVND + propVND;
        const netVND = assetsVND - debtVND;

        return {
          assetsVND,
          debtVND,
          netVND,
          netKRW: toKRW(netVND, "VND"),
          netUSD: toUSD(netVND, "VND"),
          krCash,
          krDeposit,
          vnCash,
          vnDeposit,
          fundVND,
          propVND,
          breakdownData: [
            { name: "Real Estate", value: propVND, color: "#ffe600" },
            { name: "Korea Liquid", value: toVND(krCash + krDeposit, "KRW"), color: "#00f0ff" },
            { name: "Vietnam Cash", value: vnCash + vnDeposit, color: "#00ff66" },
            { name: "Funds (CCQ)", value: fundVND, color: "#ff007f" }
          ]
        };
      }, [krParking, krSavings, vnParking, vnSavings, funds, properties, debts, fx]);

      const triggerGoogleSync = async () => {
        setSyncStatus("syncing");
        try {
          const totalInc = cashflow.filter(c => c.type === "Income").reduce((sum, c) => sum + toVND(c.amount, c.currency), 0);
          const totalExp = cashflow.filter(c => c.type === "Expense").reduce((sum, c) => sum + toVND(c.amount, c.currency), 0);

          const payload = {
            netWorthVND: totals.netVND,
            netWorthKRW: totals.netKRW,
            netWorthUSD: totals.netUSD,
            totalIncome: totalInc,
            totalExpense: totalExp,
            sixJars: jars,
            transactions: cashflow
          };

          await fetch(GOOGLE_APPS_SCRIPT_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          setSyncStatus("synced");
          setTimeout(() => setSyncStatus("idle"), 3000);
        } catch (e) {
          setSyncStatus("fail");
          setTimeout(() => setSyncStatus("idle"), 3000);
        }
      };

      const startEdit = (id, obj) => {
        setEditingId(id);
        setEditForm({ ...obj });
      };

      const cancelEdit = () => {
        setEditingId(null);
        setEditForm({});
      };

      const TABS = {
        dash: lang === "en" ? "Overview" : "대시보드",
        korea: lang === "en" ? "Korea" : "한국 금융",
        vietnam: lang === "en" ? "Vietnam" : "베트남 금융",
        invest: lang === "en" ? "Funds" : "펀드 투자",
        assets: lang === "en" ? "Property" : "실물 자산",
        cashflow: lang === "en" ? "Cashflow" : "수지 기록",
        debt: lang === "en" ? "Debts" : "부채 관리",
        analytics: lang === "en" ? "Analysis" : "종합 분석"
      };

      if (!authed) {
        return (
          <div className="min-h-screen bg-cyberDark flex items-center justify-center p-4 font-sans">
            <div className="w-full max-w-sm bg-cyberCard border border-cyberBorder rounded-xl p-6 text-center shadow-2xl">
              <h1 className="text-2xl font-black tracking-widest text-white mb-2">Youmelittlepenny</h1>
              <p className="text-xs text-slate-400 mb-6 font-mono">Encrypted Terminal Interface</p>
              <form onSubmit={(e) => {
                e.preventDefault();
                if (passInput === "$1Million") {
                  sessionStorage.setItem("auth_pass", "$1Million");
                  setAuthed(true);
                } else alert("Access Denied");
              }} className="space-y-4">
                <input
                  type="password"
                  value={passInput}
                  onChange={(e) => setPassInput(e.target.value)}
                  placeholder="Enter Passcode"
                  className="w-full px-4 py-2.5 text-center text-lg rounded-lg border tracking-widest font-mono"
                  autoFocus
                />
                <button type="submit" className="w-full py-2.5 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-lg font-mono">
                  Authenticate
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-cyberDark text-slate-200 font-sans">
          <header className="border-b border-cyberBorder bg-cyberCard/90 backdrop-blur sticky top-0 z-50 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <h1 className="text-xl font-black tracking-widest text-white">Youmelittlepenny</h1>

              <div className="flex items-center gap-4 text-xs font-mono bg-cyberDark px-3 py-1.5 rounded-lg border border-slate-800">
                <div className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-neonGreen animate-pulse"></span>
                  <span className="text-slate-400">USD/KRW:</span>
                  <span className="text-neonCyan font-bold">{fx.USD_KRW}</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-slate-400">USD/VND:</span>
                  <span className="text-neonCyan font-bold">{fx.USD_VND.toLocaleString()}</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-slate-400">KRW/VND:</span>
                  <span className="text-neonCyan font-bold">{fx.KRW_VND}</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={triggerGoogleSync}
                  className={`text-xs px-3 py-1.5 rounded font-mono font-bold transition ${
                    syncStatus === "syncing" ? "bg-amber-500 text-black animate-pulse" :
                    syncStatus === "synced" ? "bg-neonGreen text-black" :
                    syncStatus === "fail" ? "bg-rose-500 text-white" :
                    "bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30"
                  }`}
                >
                  {syncStatus === "syncing" ? "Syncing..." : syncStatus === "synced" ? "Synced" : syncStatus === "fail" ? "Sync Failed" : "Sync Drive"}
                </button>

                <div className="flex rounded border border-cyberBorder overflow-hidden text-xs font-mono font-bold">
                  <button onClick={() => setLang("en")} className={`px-2 py-1 ${lang === "en" ? "bg-cyan-500 text-black" : "bg-slate-900 text-slate-400"}`}>EN</button>
                  <button onClick={() => setLang("ko")} className={`px-2 py-1 ${lang === "ko" ? "bg-cyan-500 text-black" : "bg-slate-900 text-slate-400"}`}>KO</button>
                </div>

                <button onClick={() => { sessionStorage.clear(); setAuthed(false); }} className="text-xs text-rose-400 hover:text-rose-300 ml-1">✕</button>
              </div>
            </div>

            <div className="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto mt-3 pt-2 border-t border-slate-800/80 text-xs font-medium">
              {Object.keys(TABS).map((k) => (
                <button
                  key={k}
                  onClick={() => { setActiveTab(k); cancelEdit(); }}
                  className={`px-3 py-1.5 rounded-t-md transition whitespace-nowrap ${
                    activeTab === k
                      ? "bg-cyberCard border-b-2 border-neonCyan text-neonCyan font-bold"
                      : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  {TABS[k]}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-7xl mx-auto p-4 space-y-6">
            {activeTab === "dash" && (
              <div className="space-y-6">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl p-6 relative overflow-hidden">
                  <div className="text-xs font-mono uppercase tracking-widest text-slate-400 mb-1">{lang === "en" ? "Net Worth" : "순자산"}</div>
                  <div className="text-3xl md:text-5xl font-black text-white neon-glow-green font-mono mb-4">
                    {fmt(totals.netVND, "VND")}
                  </div>
                  <div className="flex flex-wrap items-center gap-6 text-sm font-mono pt-3 border-t border-slate-800">
                    <div>
                      <span className="text-slate-500 text-xs block">KRW</span>
                      <span className="text-neonCyan font-bold">{fmt(totals.netKRW, "KRW")}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 text-xs block">USD</span>
                      <span className="text-neonYellow font-bold">{fmt(totals.netUSD, "USD")}</span>
                    </div>

                      onClick={() => setFunds([...funds, { id: "f_" + Date.now(), code: "DCDS", units: 10, buyNav: 15000, currentNav: 15000, history: [15000] }])}
                      className="text-xs px-2.5 py-1 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded font-mono"
                    >
                      + Add Fund
                    </button>
                  </div>

                  {funds.map((f, fIdx) => {
                    const isEditing = editingId === f.id;
                    const cost = f.units * f.buyNav;
                    const val = f.units * f.currentNav;
                    const pnl = val - cost;
                    const roi = cost > 0 ? (pnl / cost) * 100 : 0;

                    return (
                      <div key={f.id} className="border border-slate-800 rounded-lg p-4 bg-cyberDark/60 space-y-3 font-mono">
                        <div className="grid grid-cols-2 md:grid-cols-6 gap-3 text-xs items-center">
                          <div>
                            <span className="text-slate-500 text-[10px] block">Ticker</span>
                            {isEditing ? (
                              <input type="text" value={editForm.code} onChange={(e) => setEditForm({ ...editForm, code: e.target.value.toUpperCase() })} className="w-full px-2 py-1 rounded border font-bold uppercase" />
                            ) : <span className="font-bold text-white text-sm">{f.code}</span>}
                          </div>
                          <div>
                            <span className="text-slate-500 text-[10px] block">Units</span>
                            {isEditing ? (
                              <input type="number" step="0.01" value={editForm.units} onChange={(e) => setEditForm({ ...editForm, units: Number(e.target.value) })} className="w-full px-2 py-1 rounded border text-neonCyan" />
                            ) : <span className="text-neonCyan">{f.units}</span>}
                          </div>
                          <div>
                            <span className="text-slate-500 text-[10px] block">Buy NAV</span>
                            {isEditing ? (
                              <input type="number" value={editForm.buyNav} onChange={(e) => setEditForm({ ...editForm, buyNav: Number(e.target.value) })} className="w-full px-2 py-1 rounded border" />
                            ) : <span>{fmt(f.buyNav, "VND")}</span>}
                          </div>
                          <div>
                            <span className="text-slate-500 text-[10px] block">Current NAV</span>
                            {isEditing ? (
                              <input type="number" value={editForm.currentNav} onChange={(e) => setEditForm({ ...editForm, currentNav: Number(e.target.value) })} className="w-full px-2 py-1 rounded border text-neonGreen font-bold" />
                            ) : <span className="text-neonGreen font-bold">{fmt(f.currentNav, "VND")}</span>}
                          </div>
                          <div>
                            <span className="text-slate-500 text-[10px] block">PnL / ROI</span>
                            <span className={`font-bold ${pnl >= 0 ? "text-neonGreen" : "text-rose-400"}`}>
                              {pnl >= 0 ? "+" : ""}{fmt(pnl, "VND")} ({roi.toFixed(2)}%)
                            </span>
                          </div>
                          <div className="flex items-center justify-end gap-2">
                            {isEditing ? (
                              <>
                                <button onClick={() => {
                                  const updated = [...funds];
                                  updated[fIdx] = { ...editForm };
                                  setFunds(updated);
                                  cancelEdit();
                                }} className="px-2 py-1 bg-neonGreen text-black font-bold rounded text-xs">Save</button>
                                <button onClick={cancelEdit} className="px-2 py-1 bg-slate-800 text-slate-400 rounded text-xs">Cancel</button>
                              </>
                            ) : (
                              <>
                                <button onClick={() => startEdit(f.id, f)} className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs">Edit</button>
                                <button onClick={() => setFunds(funds.filter((_, idx) => idx !== fIdx))} className="text-rose-400 hover:text-rose-300 px-2 py-1 text-xs">Delete</button>
                              </>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ==================== TAB: PROPERTY ==================== */}
            {activeTab === "assets" && (
              <div className="space-y-6">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-bold tracking-wider text-neonCyan uppercase font-mono">Real Estate & Major Property</h2>
                      <p className="text-[11px] text-slate-500 font-mono">Real estate and housing key money deposits</p>
                    </div>
                    <button
                      onClick={() => setProperties([...properties, {
                        id: "p_" + Date.now(),
                        name: "Apartment",
                        type: "Real Estate",
                        address: "Vietnam",
                        buyDate: new Date().toISOString().slice(0, 10),
                        buyPrice: 1000000000,
                        currency: "VND",
                        valuation: 1000000000,
                        fundedFrom: "None"
                      }])}
                      className="text-xs px-2.5 py-1 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded font-mono"
                    >
                      + Add Asset
                    </button>
                  </div>

                  {properties.map((p, pIdx) => {
                    const isEditing = editingId === p.id;
                    return (
                      <div key={p.id} className="border border-slate-800 rounded-lg p-4 bg-cyberDark/60 space-y-3 font-mono">
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-3 text-xs items-center">
                          <div>
                            <span className="text-slate-500 text-[10px] block">Asset Name</span>
                            {isEditing ? (
                              <input type="text" value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} className="w-full px-2 py-1 rounded border font-bold" />
                            ) : <span className="font-bold text-white">{p.name}</span>}
                          </div>
                          <div>
                            <span className="text-slate-500 text-[10px] block">Location</span>
                            {isEditing ? (
                              <input type="text" value={editForm.address} onChange={(e) => setEditForm({ ...editForm, address: e.target.value })} className="w-full px-2 py-1 rounded border" />
                            ) : <span className="text-slate-300">{p.address}</span>}
                          </div>
                          <div>
                            <span className="text-slate-500 text-[10px] block">Valuation</span>
                            {isEditing ? (
                              <div className="flex gap-1">
                                <input type="number" value={editForm.valuation} onChange={(e) => setEditForm({ ...editForm, valuation: Number(e.target.value) })} className="w-full px-2 py-1 rounded border text-neonYellow font-bold" />
                                <select value={editForm.currency} onChange={(e) => setEditForm({ ...editForm, currency: e.target.value })} className="w-16 px-1 py-1 rounded border text-xs">
                                  <option value="VND">VND</option>
                                  <option value="KRW">KRW</option>
                                  <option value="USD">USD</option>
                                </select>
                              </div>
                            ) : <span className="font-bold text-neonYellow text-sm">{fmt(p.valuation, p.currency)}</span>}
                          </div>
                          <div>
                            <span className="text-slate-500 text-[10px] block">Funded Source</span>
                            {isEditing ? (
                              <select value={editForm.fundedFrom} onChange={(e) => setEditForm({ ...editForm, fundedFrom: e.target.value })} className="w-full px-2 py-1 rounded border text-xs">
                                <option value="None">None</option>
                                <option value="KRW Parking">KRW Parking</option>
                                <option value="VND Parking">VND Parking</option>
                              </select>
                            ) : <span>{p.fundedFrom || "None"}</span>}
                          </div>
                          <div className="flex items-center justify-end gap-2">
                            {isEditing ? (
                              <>
                                <button onClick={() => {
                                  const updated = [...properties];
                                  updated[pIdx] = { ...editForm };
                                  setProperties(updated);
                                  cancelEdit();
                                }} className="px-2 py-1 bg-neonGreen text-black font-bold rounded text-xs">Save</button>
                                <button onClick={cancelEdit} className="px-2 py-1 bg-slate-800 text-slate-400 rounded text-xs">Cancel</button>
                              </>
                            ) : (
                              <>
                                <button onClick={() => startEdit(p.id, p)} className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs">Edit</button>
                                <button onClick={() => setProperties(properties.filter((_, idx) => idx !== pIdx))} className="text-rose-400 hover:text-rose-300 px-2 py-1 text-xs">Delete</button>
                              </>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ==================== TAB: CASHFLOW (6 JARS) ==================== */}
            {activeTab === "cashflow" && (
              <div className="space-y-6">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-bold tracking-wider text-neonCyan uppercase font-mono">Cashflow Terminal</h2>
                      <p className="text-[11px] text-slate-500 font-mono">Strict 6 Jars category classification</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setShowJarModal(true)}
                        className="text-xs px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 rounded font-mono"
                      >
                        ⚙️ Configure Jars
                      </button>
                      <button
                        onClick={() => setCashflow([
                          {
                            id: "c_" + Date.now(),
                            date: new Date().toISOString().slice(0, 10),
                            type: "Expense",
                            jarId: "NEC",
                            catId: "nec_groc",
                            amount: 25000,
                            currency: "KRW",
                            account: "Toss Bank",
                            desc: "Supermarket",
                            fee: 0
                          },
                          ...cashflow
                        ])}
                        className="text-xs px-2.5 py-1 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded font-mono"
                      >
                        + Log Record
                      </button>
                    </div>
                  </div>

                  <div className="space-y-2">
                    {cashflow.sort((a,b) => new Date(b.date) - new Date(a.date)).map((c, cIdx) => {
                      const isEditing = editingId === c.id;
                      const activeJar = jars.find(j => j.id === (isEditing ? editForm.jarId : c.jarId)) || jars[0];

                      return (
                        <div key={c.id} className="border border-slate-800 rounded p-2.5 bg-cyberDark/60 grid grid-cols-2 md:grid-cols-7 gap-2 text-xs font-mono items-center">
                          <div>
                            <span className="text-[10px] text-slate-500 block">Date</span>
                            {isEditing ? (
                              <input type="date" value={editForm.date} onChange={(e) => setEditForm({ ...editForm, date: e.target.value })} className="w-full px-1.5 py-0.5 rounded border text-[11px]" />
                            ) : <span>{c.date}</span>}
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-500 block">Type</span>
                            {isEditing ? (
                              <select value={editForm.type} onChange={(e) => setEditForm({ ...editForm, type: e.target.value })} className="w-full px-1.5 py-0.5 rounded border font-bold">
                                <option value="Income">Income</option>
                                <option value="Expense">Expense</option>
                              </select>
                            ) : <span className={c.type === "Income" ? "text-neonGreen font-bold" : "text-rose-400"}>{c.type}</span>}
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-500 block">Jar & Category</span>
                            {isEditing ? (
                              <div className="space-y-1">
                                <select value={editForm.jarId} onChange={(e) => setEditForm({ ...editForm, jarId: e.target.value, catId: jars.find(j => j.id === e.target.value)?.categories[0]?.id })} className="w-full px-1.5 py-0.5 rounded border text-[10px]">
                                  {jars.map(j => <option key={j.id} value={j.id}>{lang === "en" ? j.nameEn : j.nameKo}</option>)}
                                </select>
                                <select value={editForm.catId} onChange={(e) => setEditForm({ ...editForm, catId: e.target.value })} className="w-full px-1.5 py-0.5 rounded border text-[10px]">
                                  {activeJar.categories.map(cat => <option key={cat.id} value={cat.id}>{lang === "en" ? cat.en : cat.ko}</option>)}
                                </select>
                              </div>
                            ) : (
                              <div>
                                <span className="text-cyan-400 block text-[10px]">{c.jarId}</span>
                                <span className="text-slate-300">{activeJar.categories.find(cat => cat.id === c.catId)?.[lang] || c.catId}</span>
                              </div>
                            )}
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-500 block">Amount</span>
                            {isEditing ? (
                              <div className="flex gap-1">
                                <input type="number" value={editForm.amount} onChange={(e) => setEditForm({ ...editForm, amount: Number(e.target.value) })} className="w-full px-1.5 py-0.5 rounded border font-bold" />
                                <select value={editForm.currency} onChange={(e) => setEditForm({ ...editForm, currency: e.target.value })} className="w-14 px-1 py-0.5 rounded border text-[10px]">
                                  <option value="KRW">KRW</option>
                                  <option value="VND">VND</option>
                                  <option value="USD">USD</option>
                                </select>
                              </div>
                            ) : <span className={`font-bold ${c.type === "Income" ? "text-neonGreen" : "text-rose-400"}`}>{fmt(c.amount, c.currency)}</span>}
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-500 block">Account</span>
                            {isEditing ? (
                              <input type="text" value={editForm.account} onChange={(e) => setEditForm({ ...editForm, account: e.target.value })} className="w-full px-1.5 py-0.5 rounded border text-xs" />
                            ) : <span>{c.account}</span>}
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-500 block">Note</span>
                            {isEditing ? (
                              <input type="text" value={editForm.desc} onChange={(e) => setEditForm({ ...editForm, desc: e.target.value })} className="w-full px-1.5 py-0.5 rounded border text-xs" />
                            ) : <span className="text-slate-400">{c.desc}</span>}
                          </div>
                          <div className="flex items-center justify-end gap-2">
                            {isEditing ? (
                              <>
                                <button onClick={() => {
                                  const updated = [...cashflow];
                                  updated[cIdx] = { ...editForm };
                                  setCashflow(updated);
                                  cancelEdit();
                                }} className="px-2 py-1 bg-neonGreen text-black font-bold rounded text-xs">Save</button>
                                <button onClick={cancelEdit} className="px-2 py-1 bg-slate-800 text-slate-400 rounded text-xs">Cancel</button>
                              </>
                            ) : (
                              <>
                                <button onClick={() => startEdit(c.id, c)} className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs">Edit</button>
                                <button onClick={() => setCashflow(cashflow.filter((_, idx) => idx !== cIdx))} className="text-rose-400 hover:text-rose-300 px-2 py-1 text-xs">Delete</button>
                              </>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ==================== TAB: DEBTS ==================== */}
            {activeTab === "debt" && (
              <div className="space-y-6">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-bold tracking-wider text-rose-400 uppercase font-mono">Liabilities & Held Security Deposits</h2>
                      <p className="text-[11px] text-slate-500 font-mono">Deducts directly from Net Worth</p>
                    </div>
                    <button
                      onClick={() => setDebts([...debts, { id: "d_" + Date.now(), name: "Tenant Deposit", amount: 10000000, currency: "VND", party: "Tenant", dueDate: "2027-05-09", note: "" }])}
                      className="text-xs px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded font-mono"
                    >
                      + Add Obligation
                    </button>
                  </div>

                  {debts.map((d, dIdx) => {
                    const isEditing = editingId === d.id;
                    return (
                      <div key={d.id} className="border border-slate-800 rounded-lg p-4 bg-cyberDark/60 grid grid-cols-2 md:grid-cols-5 gap-3 text-xs items-center font-mono">
                        <div>
                          <span className="text-slate-500 text-[10px] block">Obligation</span>
                          {isEditing ? (
                            <input type="text" value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} className="w-full px-2 py-1 rounded border font-bold text-white" />
                          ) : <span className="font-bold text-white">{d.name}</span>}
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] block">Party</span>
                          {isEditing ? (
                            <input type="text" value={editForm.party} onChange={(e) => setEditForm({ ...editForm, party: e.target.value })} className="w-full px-2 py-1 rounded border" />
                          ) : <span className="text-slate-300">{d.party}</span>}
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] block">Amount</span>
                          {isEditing ? (
                            <div className="flex gap-1">
                              <input type="number" value={editForm.amount} onChange={(e) => setEditForm({ ...editForm, amount: Number(e.target.value) })} className="w-full px-2 py-1 rounded border text-rose-400 font-bold" />
                              <select value={editForm.currency} onChange={(e) => setEditForm({ ...editForm, currency: e.target.value })} className="w-16 px-1 py-1 rounded border text-xs">
                                <option value="VND">VND</option>
                                <option value="KRW">KRW</option>
                                <option value="USD">USD</option>
                              </select>
                            </div>
                          ) : <span className="font-bold text-rose-400 text-sm">-{fmt(d.amount, d.currency)}</span>}
                        </div>
                        <div>
                          <span className="text-slate-500 text-[10px] block">Due Date</span>
                          {isEditing ? (
                            <input type="date" value={editForm.dueDate} onChange={(e) => setEditForm({ ...editForm, dueDate: e.target.value })} className="w-full px-2 py-1 rounded border text-xs" />
                          ) : <span>{d.dueDate}</span>}
                        </div>
                        <div className="flex items-center justify-end gap-2">
                          {isEditing ? (
                            <>
                              <button onClick={() => {
                                const updated = [...debts];
                                updated[dIdx] = { ...editForm };
                                setDebts(updated);
                                cancelEdit();
                              }} className="px-2 py-1 bg-neonGreen text-black font-bold rounded text-xs">Save</button>
                              <button onClick={cancelEdit} className="px-2 py-1 bg-slate-800 text-slate-400 rounded text-xs">Cancel</button>
                            </>
                          ) : (
                            <>
                              <button onClick={() => startEdit(d.id, d)} className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs">Edit</button>
                              <button onClick={() => setDebts(debts.filter((_, idx) => idx !== dIdx))} className="text-rose-400 hover:text-rose-300 px-2 py-1 text-xs">Delete</button>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ==================== TAB: ANALYSIS (6 JARS) ==================== */}
            {activeTab === "analytics" && (
              <div className="space-y-6">
                <div className="bg-cyberCard border border-cyberBorder rounded-xl p-5 space-y-4">
                  <h2 className="text-sm font-bold tracking-wider text-neonCyan uppercase font-mono">6 Jars System Performance</h2>
                  <div className="space-y-3 font-mono text-xs">
                    {jars.map(j => {
                      const spent = cashflow.filter(c => c.jarId === j.id && c.type === "Expense").reduce((sum, c) => sum + toVND(c.amount, c.currency), 0);
                      return (
                        <div key={j.id} className="p-3 bg-cyberDark/60 rounded border border-slate-800 flex items-center justify-between">
                          <div>
                            <span className="font-bold text-white block">{lang === "en" ? j.nameEn : j.nameKo}</span>
                            <span className="text-[10px] text-slate-500">{j.categories.length} Categories</span>
                          </div>
                          <div className="text-right">
                            <span className="text-neonPink font-bold block">{fmt(spent, "VND")}</span>
                            <span className="text-slate-400 text-[10px]">Target: {j.pct}%</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
